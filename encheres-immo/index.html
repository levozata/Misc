<title>Enchères Immo France</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Layout: Dilara back-office — white top bar with pill tabs, warm paper ground, white 16px-radius panels, teal-slate accent, status pills */
:root{
  --bg:#F7F5F2; --surface:#FFFFFF; --surface-2:#F0EDE8; --line:#E4DFD7; --line-strong:#D9D4CC;
  --ink:#2C3E35; --muted:#56655D; --faint:#6B7B72;
  --accent:#3B6372; --accent-2:#4A7C8E; --accent-soft:#EBF2F5; --on-accent:#FFFFFF;
  --ok:#3F7550; --ok-bg:#DFEBE3; --warn:#7A5C1F; --warn-bg:#F5EDE0; --bad:#8A3B2E; --bad-bg:#F6E3E0;
  --land:#ECE8E1; --land-line:#D9D4CC;
  --c-appartement:#3B6372; --c-maison:#A86F1F; --c-immeuble:#6B5B95; --c-commerce:#3F7550; --c-terrain:#7F8F3A; --c-parking:#8A3B2E; --c-autre:#6B7B72; --c-parts:#6B7B72;
  --font:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r-lg:16px; --r-md:12px; --r-sm:9px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141917; --surface:#1C2320; --surface-2:#232C28; --line:#2E3934; --line-strong:#3A4640;
  --ink:#E4EAE6; --muted:#A3B1A9; --faint:#8C9A92;
  --accent:#86B7C8; --accent-2:#6FA3B6; --accent-soft:#22343B; --on-accent:#0F1A1E;
  --ok:#8FCAA2; --ok-bg:#1E3427; --warn:#E2C07E; --warn-bg:#382E1C; --bad:#EBA394; --bad-bg:#3A221D;
  --land:#212925; --land-line:#34403A;
  --c-appartement:#86B7C8; --c-maison:#E2B062; --c-immeuble:#B3A4DD; --c-commerce:#8FCAA2; --c-terrain:#C3CF7E; --c-parking:#EBA394; --c-autre:#A3B1A9; --c-parts:#A3B1A9;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141917; --surface:#1C2320; --surface-2:#232C28; --line:#2E3934; --line-strong:#3A4640;
  --ink:#E4EAE6; --muted:#A3B1A9; --faint:#8C9A92;
  --accent:#86B7C8; --accent-2:#6FA3B6; --accent-soft:#22343B; --on-accent:#0F1A1E;
  --ok:#8FCAA2; --ok-bg:#1E3427; --warn:#E2C07E; --warn-bg:#382E1C; --bad:#EBA394; --bad-bg:#3A221D;
  --land:#212925; --land-line:#34403A;
  --c-appartement:#86B7C8; --c-maison:#E2B062; --c-immeuble:#B3A4DD; --c-commerce:#8FCAA2; --c-terrain:#C3CF7E; --c-parking:#EBA394; --c-autre:#A3B1A9; --c-parts:#A3B1A9;
  color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select{font-family:inherit;font-size:inherit;color:inherit}
a{color:var(--accent)} a:hover{color:var(--accent-2)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

/* top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:var(--surface);border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:16px;padding-block:12px;padding-inline:24px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.mark{width:32px;height:32px;border-radius:50%;background:var(--accent-2);color:var(--on-accent);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px;flex-shrink:0}
.brand b{font-weight:600;font-size:16px;white-space:nowrap}
.tabs{display:flex;gap:4px;padding:4px;background:var(--surface-2);border-radius:var(--r-md);overflow-x:auto;max-width:100%}
.tabs button{height:36px;padding:0 14px;border:0;border-radius:var(--r-sm);font-size:13px;font-weight:500;cursor:pointer;background:transparent;color:var(--muted);white-space:nowrap}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.bar .spacer{flex:1}
.tag{font-size:12px;color:var(--muted);background:var(--surface-2);padding:6px 10px;border-radius:999px;white-space:nowrap}

main{padding-block:28px 64px;padding-inline:24px;max-width:1480px;margin:0 auto}
.eyebrow{margin:0 0 4px;font-size:12px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--accent)}
h1{margin:0;font-size:28px;font-weight:700;letter-spacing:-.02em;text-wrap:balance}
h2{margin:0;font-size:18px;font-weight:600;text-wrap:balance}
h3{margin:0;font-size:15px;font-weight:600}
.lede{margin:6px 0 0;color:var(--muted);font-size:15px;max-width:75ch}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:20px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:20px 22px;min-width:0}
.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-bottom:20px}
.stat p{margin:0}
.stat .k{font-size:12px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.stat .v{font-size:26px;font-weight:700;letter-spacing:-.01em}
.stat .s{font-size:13px;color:var(--muted);margin-top:2px}

/* filters */
.filters{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:16px}
.field{display:flex;flex-direction:column;gap:4px}
.field label{font-size:12px;font-weight:600;color:var(--muted)}
.inp,.sel{height:40px;border:1px solid var(--line-strong);background:var(--surface);border-radius:var(--r-sm);padding:0 12px;min-width:0}
.inp:focus,.sel:focus{border-color:var(--accent)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{height:34px;padding:0 12px;border:1px solid var(--line-strong);background:var(--surface);border-radius:999px;font-size:13px;font-weight:500;cursor:pointer;color:var(--muted);display:inline-flex;align-items:center;gap:6px}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--on-accent)}
.chip .dot{width:8px;height:8px;border-radius:50%}
.btn{height:40px;padding:0 16px;border:0;background:var(--accent);color:var(--on-accent);border-radius:var(--r-sm);font-size:13px;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:8px;text-decoration:none}
.btn:hover{background:var(--accent-2);color:var(--on-accent)}
.btn.ghost{background:var(--surface);color:var(--ink);border:1px solid var(--line-strong)}
.btn.ghost:hover{border-color:var(--accent);color:var(--accent)}
.btn.sm{height:34px;padding:0 12px;font-size:12px}

/* map + list */
.split{display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:16px;align-items:start}
.mapwrap{position:sticky;top:96px;padding:0;overflow:hidden}
.maptools{display:flex;gap:6px;padding:12px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap;align-items:center}
.maptools .hint{font-size:12px;color:var(--faint);margin-left:auto}
#map{display:block;width:100%;height:min(68vh,640px);background:var(--surface);touch-action:none;cursor:grab}
#map .dep{fill:var(--land);stroke:var(--land-line);stroke-width:.8;vector-effect:non-scaling-stroke}
#map .dep:hover{fill:var(--surface-2)}
#map circle.pt{stroke:var(--surface);cursor:pointer}
#map circle.pt.sel{stroke:var(--ink);stroke-width:2.5}
.legend{display:flex;flex-wrap:wrap;gap:10px 14px;padding:10px 14px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:9px;height:9px;border-radius:50%;display:inline-block}
.tip{position:fixed;pointer-events:none;z-index:60;background:var(--ink);color:var(--bg);font-size:12px;padding:6px 9px;border-radius:8px;max-width:260px}

.listhead{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.listhead .count{font-size:13px;color:var(--muted)}
.list{display:flex;flex-direction:column;gap:10px}
.row{display:grid;grid-template-columns:84px minmax(0,1fr) auto;gap:14px;align-items:center;padding:12px 14px;background:var(--surface);border:1px solid var(--line);border-radius:14px;cursor:pointer;text-align:left;width:100%}
.row:hover{border-color:var(--accent-2)}
.row.sel{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.thumb{width:84px;height:64px;border-radius:10px;background:var(--surface-2);object-fit:cover;display:flex;align-items:center;justify-content:center;color:var(--faint);overflow:hidden}
.thumb svg{width:26px;height:26px}
.row .t{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .m{font-size:12.5px;color:var(--muted);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .pills{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.price{text-align:right}
.price .mp{font-weight:700;font-size:15px}
.price .lbl{font-size:11px;color:var(--faint)}
.price .est{font-size:12px;color:var(--accent);margin-top:2px}
.pill{font-size:11.5px;font-weight:600;padding:3px 9px;border-radius:999px;white-space:nowrap;border:1px solid transparent;display:inline-flex;align-items:center;gap:5px}
.pill.neutral{background:var(--surface-2);color:var(--muted);border-color:var(--line)}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.bad{background:var(--bad-bg);color:var(--bad)}
.pill.info{background:var(--accent-soft);color:var(--accent)}
.more{margin-top:12px;width:100%}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(20,25,23,.38);z-index:40}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(640px,100%);background:var(--bg);z-index:50;overflow-y:auto;border-left:1px solid var(--line);
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.dhead{position:sticky;top:0;background:var(--surface);border-bottom:1px solid var(--line);padding:14px 20px;display:flex;gap:12px;align-items:flex-start;z-index:2}
.dhead .x{margin-left:auto;flex-shrink:0;width:40px;height:40px;border-radius:10px;border:1px solid var(--line-strong);background:var(--surface);cursor:pointer;display:flex;align-items:center;justify-content:center}
.dbody{padding:18px 20px 40px;display:flex;flex-direction:column;gap:14px}
.gallery{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.gallery button{padding:0;border:0;background:var(--surface-2);border-radius:12px;overflow:hidden;cursor:zoom-in;aspect-ratio:4/3}
.gallery img{width:100%;height:100%;object-fit:cover;display:block}
.gallery button:first-child{grid-column:1 / -1;aspect-ratio:16/9}
.nophoto{display:flex;gap:12px;align-items:center;padding:14px 16px;border:1px dashed var(--line-strong);border-radius:12px;color:var(--muted);font-size:13px}
.kv{display:grid;grid-template-columns:150px minmax(0,1fr);gap:8px 14px;font-size:13.5px}
.kv dt{color:var(--muted)} .kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.sec h3{margin-bottom:10px;display:flex;align-items:center;gap:8px}
.sec .sub{font-size:12.5px;color:var(--muted);margin:-4px 0 10px}
.desc{white-space:pre-line;font-size:13.5px;color:var(--ink)}
.lot + .lot{margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
.lot b{font-weight:600}
.band{position:relative;height:46px;margin:6px 0 4px}
.band .track{position:absolute;left:0;right:0;top:20px;height:6px;border-radius:3px;background:var(--surface-2)}
.band .iq{position:absolute;top:16px;height:14px;border-radius:7px;background:var(--accent-soft);border:1px solid var(--accent-2)}
.band .tick{position:absolute;top:10px;width:2px;height:26px;background:var(--accent)}
.band .mk{position:absolute;top:12px;width:12px;height:12px;border-radius:50%;transform:translateX(-6px);border:2px solid var(--surface)}
.band .lab{position:absolute;top:-2px;font-size:11px;color:var(--muted);transform:translateX(-50%);white-space:nowrap}
.band .lab2{position:absolute;top:36px;font-size:11px;color:var(--muted);transform:translateX(-50%);white-space:nowrap}
.fees{width:100%;border-collapse:collapse;font-size:13.5px}
.fees td{padding:7px 0;border-bottom:1px solid var(--line)}
.fees td:last-child{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.fees tr.tot td{font-weight:700;border-bottom:0;padding-top:10px}
.fees .why{display:block;font-size:11.5px;color:var(--faint)}
.calc{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:12px}
.tips{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:10px}
.tips li{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:start;font-size:13.5px}
.tips .ic{width:24px;height:24px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700}
.tips .ic.ok{background:var(--ok-bg);color:var(--ok)} .tips .ic.warn{background:var(--warn-bg);color:var(--warn)} .tips .ic.bad{background:var(--bad-bg);color:var(--bad)} .tips .ic.info{background:var(--accent-soft);color:var(--accent)}
.people{display:flex;flex-direction:column;gap:10px}
.person{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;padding:12px 14px;background:var(--surface-2);border-radius:12px}
.person .av{width:36px;height:36px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:13px}
.person .role{font-size:11.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--muted)}
.person .nm{font-weight:600}
.person .ct{font-size:12.5px;color:var(--muted);white-space:pre-line;overflow-wrap:anywhere}
.copy{border:0;background:transparent;color:var(--accent);cursor:pointer;font-size:12px;font-weight:600;padding:0 4px}
.docs{display:flex;gap:8px;flex-wrap:wrap}
.lightbox{position:fixed;inset:0;z-index:70;background:rgba(10,12,11,.88);display:flex;align-items:center;justify-content:center;padding:24px}
.lightbox img{max-width:100%;max-height:100%;border-radius:10px}
.lightbox button{position:absolute;top:calc(16px + env(safe-area-inset-top,0px));right:16px;height:40px;padding:0 14px;border-radius:10px;border:0;background:#fff;color:#1c2320;font-weight:600;cursor:pointer}

/* calendar */
.day{margin-bottom:18px}
.dayh{display:flex;align-items:baseline;gap:10px;margin:0 0 8px}
.dayh h2{font-size:16px}
.dayh span{color:var(--muted);font-size:13px}
.ctable{width:100%;border-collapse:collapse;font-size:13.5px}
.ctable th{text-align:left;font-size:11.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);padding:8px 10px;border-bottom:1px solid var(--line)}
.ctable td{padding:10px;border-bottom:1px solid var(--line);vertical-align:top}
.ctable tr:last-child td{border-bottom:0}
.ctable tr.click{cursor:pointer} .ctable tr.click:hover td{background:var(--surface-2)}
.tw{overflow-x:auto}
.twocol{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:16px;align-items:start}

/* model */
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
#scatter{width:100%;height:auto;display:block}
.axis text{fill:var(--muted);font-size:11px;font-family:var(--font)}
.axis line,.axis path{stroke:var(--line-strong)}
.gridl line{stroke:var(--line)}
.note{font-size:12.5px;color:var(--muted)}
.bars{display:flex;flex-direction:column;gap:8px}
.bars .b{display:grid;grid-template-columns:150px minmax(0,1fr) 120px;gap:10px;align-items:center;font-size:13px}
.bars .tr{position:relative;height:14px;background:var(--surface-2);border-radius:7px}
.bars .iq{position:absolute;top:0;bottom:0;background:var(--accent-soft);border:1px solid var(--accent-2);border-radius:7px}
.bars .md{position:absolute;top:-3px;bottom:-3px;width:3px;background:var(--accent);border-radius:2px}

/* steps */
.steps{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:0}
.steps li{display:grid;grid-template-columns:36px minmax(0,1fr);gap:12px;padding-bottom:16px;position:relative}
.steps li:before{content:"";position:absolute;left:17px;top:34px;bottom:0;width:2px;background:var(--line)}
.steps li:last-child:before{display:none}
.steps .n{width:36px;height:36px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-weight:700;display:flex;align-items:center;justify-content:center}
.steps p{margin:2px 0 0;color:var(--muted);font-size:13.5px}
.timeline{list-style:none;margin:0;padding:0}
.timeline li{display:grid;grid-template-columns:96px minmax(0,1fr);gap:12px;padding:8px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.timeline li:last-child{border-bottom:0}
.timeline .d{font-weight:600;color:var(--accent);font-variant-numeric:tabular-nums}
.timeline li.future .d{color:var(--warn)}
.callout{padding:14px 16px;border-radius:12px;background:var(--warn-bg);color:var(--warn);font-size:13.5px}
.callout.info{background:var(--accent-soft);color:var(--accent)}
.callout b{font-weight:700}
.empty{padding:28px;text-align:center;color:var(--muted)}
.src{font-size:12px;color:var(--faint);margin-top:24px;max-width:90ch}
.range{width:100%}

@media (max-width:1100px){.split{grid-template-columns:1fr}.mapwrap{position:static}#map{height:52vh}.twocol{grid-template-columns:1fr}}
@media (max-width:760px){
  .bar{padding-inline:16px} main{padding-inline:16px}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .grid2{grid-template-columns:1fr}
  .row{grid-template-columns:64px minmax(0,1fr)}
  .row .price{grid-column:2;text-align:left;display:flex;gap:10px;align-items:baseline}
  .thumb{width:64px;height:52px}
  .kv{grid-template-columns:1fr} .kv dt{margin-top:6px}
  .bars .b{grid-template-columns:1fr;gap:4px}
  .brand b{font-size:15px}
  .tag{display:none}
}
@media (prefers-reduced-motion:no-preference){.drawer{animation:slide .18s ease-out}@keyframes slide{from{transform:translateX(24px);opacity:.6}to{transform:none;opacity:1}}}
</style>
</head>
<body>

<style>
.lang{display:flex;gap:2px;padding:3px;background:var(--surface-2);border-radius:10px}
.lang button{height:30px;min-width:38px;padding:0 8px;border:0;border-radius:7px;background:transparent;color:var(--muted);font-size:12px;font-weight:600;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
@media (max-width:760px){.bar{gap:10px}.lang{order:2}}
.sbox{position:relative}
.sbox .inp{width:100%;padding-left:36px;padding-right:72px}
.sico{position:absolute;left:12px;top:12px;color:var(--faint);pointer-events:none}
.kbd{position:absolute;right:42px;top:9px;font:600 11px/20px var(--font);padding:0 6px;border:1px solid var(--line-strong);border-radius:6px;color:var(--faint);background:var(--surface-2)}
.qhelp{position:absolute;right:6px;top:6px;width:28px;height:28px;border-radius:7px;border:1px solid var(--line-strong);background:var(--surface);color:var(--muted);font-weight:700;cursor:pointer}
.sugg{position:absolute;left:0;right:0;top:calc(100% + 6px);z-index:35;background:var(--surface);border:1px solid var(--line-strong);border-radius:12px;box-shadow:0 12px 32px rgba(0,0,0,.14);max-height:420px;overflow-y:auto;padding:6px}

 steps:[['Read the conditions of sale and the report','The <i>cahier des conditions de vente</i> and <i>PV descriptif</i> are often PDFs on Licitor: floor area, occupancy, service-charge arrears, special terms.'],
  ['Attend the viewing','Held once, for about an hour. There is usually no second chance.'],
  ['Hire a lawyer from the court’s bar','Only a lawyer registered with that <i>tribunal judiciaire</i>’s bar can bid. You give them a written ceiling.'],
  ['Prepare the deposit','Banker’s draft or CARPA transfer, ID, proof of funds. No mortgage-contingent bids.'],
  ['Auction day','Timed bidding: a bid wins if nobody tops it within 90 seconds.'],
  ['10-day surenchère','During this window anyone can reopen the sale by offering at least 10% more.'],
  ['Payment','The price is usually due within 2 months, costs within the first month; interest accrues on late payment.']],

  ['info','i','Ask the building manager (<i>syndic</i>) for the last three AGM minutes to check arrears and approved works.'],

function passFilters(x){
  if(st.zone&&x.zone!==st.zone)return false;
  if(st.dep&&x.dep!==st.dep)return false;
  if(st.court&&x.court!==st.court)return false;
  if(st.lawyer&&!x.lawKeys.includes(st.lawyer))return false;
  if(st.city&&x.city!==st.city)return false;
  if(st.cats.size&&!st.cats.has(x.cat))return false;
  if(st.mpMin!==''&&!(x.mp>=+st.mpMin))return false;
  if(st.mpMax!==''&&!(x.mp&&x.mp<=+st.mpMax))return false;
  if(st.sMin!==''&&!(x.surface>=+st.sMin))return false;
  if(st.sMax!==''&&!(x.surface&&x.surface<=+st.sMax))return false;
  if(st.dFrom&&!(x.date&&x.date.slice(0,10)>=st.dFrom))return false;
  if(st.dTo&&!(x.date&&x.date.slice(0,10)<=st.dTo))return false;
  if(st.week&&!(x.date&&daysTo(x.date)>=0&&daysTo(x.date)<=7))return false;
  if(st.occ){if(st.occ==='unk'?x.occ!=null:x.occ!==st.occ)return false;}
  if(st.disc&&!(x.marketValue&&x.mp&&x.mp/x.marketValue<=+st.disc))return false;
  for(const f of st.flags)if(!flagOK(x,f))return false;
  for(const d of st.docs)if(!docOK(x,d))return false;
  return true;}
function sortVal(x,k){switch(k){
  case 'rel':return x._score;case 'date':return x.date||null;case 'pub':return x.published||null;case 'mp':return x.mp||null;case 'surf':return x.surface||null;
  case 'ppm':return x.mp&&x.surface?x.mp/x.surface:null;case 'disc':return x.mp&&x.marketValue?x.mp/x.marketValue:null;case 'upside':return x.pred&&x.mp?x.pred.p50/x.mp:null;
  case 'visit':return x.visitDates.filter(d=>daysTo(d)>=0)[0]||null;case 'city':return NORM(x.city)||null;case 'court':return NORM(x.court)||null;}}
function cmpBy(k,dir){return (a,b)=>{const va=sortVal(a,k),vb=sortVal(b,k);if(va==null&&vb==null)return 0;if(va==null)return 1;if(vb==null)return -1;
  const c=typeof va==='string'?va.localeCompare(vb):va-vb;return c*dir||(a.date||'').localeCompare(b.date||'');};}

function suggest(){
  const box=$('#sugg'),q=$('#q').value;const raw=q.trim();
  if(!raw||/[:<>]/.test(raw.split(/\s+/).pop())){closeSugg();return;}
  const nq=NORM(raw.replace(/-?"[^"]*"?/g,' ').replace(/(^|\s)-\S+/g,' '));
  if(!nq){closeSugg();return;}
  const m=(label)=>{const n=NORM(label);if(n.startsWith(nq))return 3;if((' '+n).includes(' '+nq))return 2;if(nq.length>=3&&n.includes(nq))return 1;
    if(nq.length>=4){const tks=n.split(' ');if(tks.some(tk=>tk.length>=4&&lev(tk,nq,1)<=1))return .5;}return 0;};
  const grp=(arr,kind,max)=>arr.map(([label,val,n,extra])=>({label,val,n,extra,kind,s:m(label+' '+(extra||''))})).filter(o=>o.s).sort((a,b)=>b.s-a.s||b.n-a.n).slice(0,max);
  const cities=grp([...uniq(L.map(x=>x.city)).entries()].map(([c,n])=>[c,c,n]),'city',5);
  const dmap=new Map();L.forEach(x=>{if(x.dep)dmap.set(x.dep,[x.dep+' · '+x.depName,x.dep,(dmap.get(x.dep)||[0,0,0])[2]+1]);});
  const deps=grp([...dmap.values()],'dep',3);
  const courts=grp([...uniq(L.map(x=>x.court)).entries()].map(([c,n])=>[c.replace('Tribunal Judiciaire','TJ'),c,n]),'court',3);
  const laws=grp([...uniq(L.flatMap(x=>x.lawKeys)).entries()].map(([c,n])=>[c.replace(/^Maître\s+/,''),c,n]),'lawyer',3);
  const lst=filtered.slice().sort((a,b)=>b._score-a._score).slice(0,5).map(x=>({kind:'listing',val:x.id,label:x.title+(x.surface?' · '+sq(x.surface):''),extra:x.city+' · '+eur(x.mp)}));
  const groups=[['sg.listing',lst],['sg.city',cities],['sg.dep',deps],['sg.court',courts],['sg.lawyer',laws]].filter(g=>g[1].length);
  sItems=[];let h='';
  groups.forEach(([k,arr])=>{h+=`<div class="grp" role="presentation">${t(k)}</div>`;arr.forEach(o=>{const i=sItems.length;sItems.push(o);
    h+=`<div class="opt" role="option" id="sg${i}" data-i="${i}" aria-selected="false"><span class="ot">${hl(o.label,P)}</span><span class="oc">${o.kind==='listing'?esc(o.extra):t('sg.n',o.n)}</span></div>`;});});
  if(!sItems.length)h=`<div class="empty2">${t('sg.none')}</div>`;
  else h+=`<div class="opt" role="option" id="sg${sItems.length}" data-i="${sItems.length}" aria-selected="false"><span class="ot"><b>${t('sg.all',filtered.length)}</b></span></div>`,sItems.push({kind:'all'});
  box.innerHTML=h;box.hidden=false;$('#q').setAttribute('aria-expanded','true');sIdx=-1;
  box.querySelectorAll('.opt').forEach(o=>{o.addEventListener('mousedown',e=>{e.preventDefault();pick(+o.dataset.i);});});
}
function closeSugg(){$('#sugg').hidden=true;$('#q').setAttribute('aria-expanded','false');$('#q').removeAttribute('aria-activedescendant');sIdx=-1;}
function suggKey(e){const box=$('#sugg');
  if(e.key==='ArrowDown'||e.key==='ArrowUp'){if(box.hidden){suggest();return;}e.preventDefault();sIdx=(sIdx+(e.key==='ArrowDown'?1:-1)+sItems.length)%sItems.length;
    box.querySelectorAll('.opt').forEach((o,i)=>o.setAttribute('aria-selected',i===sIdx));const a=$('#sg'+sIdx);if(a){a.scrollIntoView({block:'nearest'});$('#q').setAttribute('aria-activedescendant','sg'+sIdx);}}
  else if(e.key==='Enter'){e.preventDefault();if(!box.hidden&&sIdx>=0)pick(sIdx);else{onQuery($('#q').value,true);closeSugg();}}}
function pick(i){const o=sItems[i];if(!o)return;closeSugg();
  if(o.kind==='listing'){openDetail(o.val);return;}
  if(o.kind==='all'){onQuery($('#q').value,true);closeSugg();return;}
  st[o.kind]=o.val;$('#q').value='';st.q='';P=parseQ('');if(!st.sortUser){st.sort='date';st.dir=1;}sortUI();apply();
  if(o.kind==='dep'||o.kind==='city'||o.kind==='court'){const pts=filtered.filter(x=>x.lat!=null);if(pts.length){const lo=d3.extent(pts,d=>d.lon),la=d3.extent(pts,d=>d.lat);zoomBox([[lo[0]-.05,la[0]-.05],[lo[1]+.05,la[1]+.05]]);}}}

/* map */
let GEO=null;const geoP=fetch('dep.json').then(r=>r.json()).then(g=>{GEO={type:'FeatureCollection',features:g.features.filter(f=>!/^97/.test(f.properties.c))};return GEO;});
const sz=k=>Math.pow(k,-0.8);
function makeMap(selector,o){
  const M={svg:null,g:null,proj:null,zoom:null,pts:null,W:800,H:600,last:null,o};
  M.svg=d3.select(selector);const node=M.svg.node();M.W=node.clientWidth||800;M.H=node.clientHeight||600;M.svg.attr('viewBox',`0 0 ${M.W} ${M.H}`);
  M.g=M.svg.append('g');
  M.ready=geoP.then(geo=>{
    M.proj=d3.geoConicConformal().parallels([44,49]).rotate([-3,0]).fitExtent([[12,12],[M.W-12,M.H-12]],geo);
    M.g.append('g').selectAll('path').data(geo.features).join('path').attr('class','dep').attr('d',d3.geoPath(M.proj)).append('title').text(f=>f.properties.n+' ('+f.properties.c+')');
    M.pts=M.g.append('g');
    M.zoom=d3.zoom().scaleExtent([1,220]).on('zoom',ev=>{M.g.attr('transform',ev.transform);const k=ev.transform.k;M.pts.selectAll('circle').attr('r',d=>o.rad(d)*sz(k)).attr('stroke-width',1/k);});
    M.svg.call(M.zoom);if(M.last)M.update(M.last);return M;});
  M.update=(pts)=>{M.last=pts;if(!M.pts)return;const k=d3.zoomTransform(M.svg.node()).k;
    const sel=M.pts.selectAll('circle').data(pts,d=>d.id);sel.exit().remove();
    sel.enter().append('circle').attr('class','pt').on('click',(ev,d)=>o.click(d))
      .on('mousemove',(ev,d)=>{const tp=$('#tip');tp.hidden=false;tp.style.left=(ev.clientX+12)+'px';tp.style.top=(ev.clientY+12)+'px';tp.innerHTML=o.tip(d);})
      .on('mouseleave',()=>{$('#tip').hidden=true;})
      .merge(sel).attr('cx',d=>M.proj([d.lon,d.lat])[0]).attr('cy',d=>M.proj([d.lon,d.lat])[1]).attr('r',d=>o.rad(d)*sz(k)).attr('stroke-width',1/k)
      .attr('fill',o.color).attr('fill-opacity',.82).classed('sel',d=>o.isSel(d));
    M.pts.selectAll('circle').sort(o.order||((a,b)=>0));};
  M.select=()=>{if(M.pts)M.pts.selectAll('circle').classed('sel',d=>o.isSel(d));};
  M.recolor=()=>{if(M.pts)M.pts.selectAll('circle').attr('fill',o.color);};
  M.zoomBox=(bb)=>{if(!M.zoom)return;if(!bb){M.svg.transition().duration(500).call(M.zoom.transform,d3.zoomIdentity);return;}
    const [[x0,y0],[x1,y1]]=[M.proj([bb[0][0],bb[1][1]]),M.proj([bb[1][0],bb[0][1]])];const k=Math.min(220,0.9/Math.max((x1-x0)/M.W,(y1-y0)/M.H,1e-6));
    M.svg.transition().duration(600).call(M.zoom.transform,d3.zoomIdentity.translate(M.W/2,M.H/2).scale(k).translate(-(x0+x1)/2,-(y0+y1)/2));};
  M.fit=(pts,pad)=>{pts=pts.filter(x=>x.lat!=null);if(!pts.length)return;const lo=d3.extent(pts,d=>d.lon),la=d3.extent(pts,d=>d.lat);pad=pad||.08;M.zoomBox([[lo[0]-pad,la[0]-pad],[lo[1]+pad,la[1]+pad]]);};
  return M;}

function strategyTips(x){const tt=T().t,out=[];
  if(x.cat==='parts')out.push(['bad','!',tt.parts]);
  if(x.marketValue){const r=x.mp/x.marketValue;out.push([r<.35?'warn':'info',r<.35?'!':'i',tt.mv(eur(x.marketValue),Math.round(r*100),r<.35)]);}
  if(x.pred)out.push(['info','i',tt.pred(eur(x.pred.p25),eur(x.pred.p75),eur(x.pred.p50))]);
  if(x.occ==='occupé')out.push(['warn','!',tt.occ]);
  if(x.occ==='libre')out.push(['ok','✓',tt.libre]);
  if(x.baisse)out.push(['warn','!',tt.baisse]);
  if(x.lic)out.push(['info','i',tt.lic]);
  if(x.surenchere)out.push(['info','i',tt.sur]);
  if(x.nLots>1)out.push(['info','i',tt.lots(x.nLots)]);
  if(x.cat==='appartement'&&x.surface&&x.surface<9)out.push(['bad','!',tt.small]);
  if(x.visitDates.length){const d=daysTo(x.visitDates[0]);out.push(d<0?['info','–',tt.visitPast]:['ok','✓',tt.visit(fmtDate(x.visitDates[0]),d)]);}else out.push(['warn','!',tt.novisit]);
  if(x.date){const d=daysTo(x.date);if(d<=10)out.push(['bad','!',tt.soon(d)]);}
  return out;}

  let h=`<div class="band"><div class="track"></div><div class="iq" style="left:${pos(p.p25)};width:calc(${pos(p.p75)} - ${pos(p.p25)})"></div><div class="tick" style="left:${pos(p.p50)}"></div>

    ${c.map(({r,d})=>{const v=ratioOf(r);return `<tr class="click" data-pid="${r.id}" tabindex="0"><td class="num">${fmtDate(r.date+'T00:00:00',{day:'numeric',month:'short',year:'2-digit'})}</td><td>${esc(r.city)}</td><td class="num r">${r.surface?dec(r.surface):'—'}</td><td class="num r">${keur(r.mp)}</td><td class="num r"><b>${keur(r.adj)}</b></td><td class="num r"><span class="pill ${rBucket(v)==='b1'?'ok':rBucket(v)==='b4'||rBucket(v)==='b3'?'warn':'neutral'}">×${dec(v.toFixed(1))}</span></td><td class="num r">${d!=null?dec(d.toFixed(1)):'—'}</td></tr>`;}).join('')}
    </tbody></table></div>`;}

/* model */
function model(){
  const M=D.model,S=M.stats,H=D.hist,x2=v=>'×'+dec(v);
  $('#modelLede').innerHTML=t('m.lede',M.n);$('#how5').innerHTML=t('m.how5',dec(M.r2.toFixed(2)));
  const all=S.all.q;
  $('#mkpis').innerHTML=[[t('mk.n'),M.n,t('mk.nS')],[t('mk.med'),x2(all[1]),t('mk.medS')],[t('mk.q'),x2(all[0])+' – '+x2(all[2]),t('mk.qS')],[t('mk.paris'),x2(S.byZone.paris.q[1]),t('mk.parisS',S.byZone.paris.n)]]
    .map(([k,v,s])=>`<div class="panel stat"><p class="k">${k}</p><p class="v num">${v}</p><p class="s">${esc(s)}</p></div>`).join('');
  const bars=(obj,lab,max)=>Object.entries(obj).filter(([k,v])=>v.n>=5).sort((a,b)=>b[1].q[1]-a[1].q[1]).map(([k,v])=>{const sc=z=>Math.min(100,z/max*100);
    return `<div class="b"><span>${esc(lab[k]||k)} <span class="note">n=${v.n}</span></span><span class="tr"><span class="iq" style="left:${sc(v.q[0])}%;width:${sc(v.q[2])-sc(v.q[0])}%"></span><span class="md" style="left:${sc(v.q[1])}%"></span></span><span class="num">${x2(v.q[1])} <span class="note">(${dec(v.q[0])}–${dec(v.q[2])})</span></span></div>`;}).join('');
  $('#byZone').innerHTML=bars(S.byZone,ZONES(),8);$('#byCat').innerHTML=bars(S.byCat,CATS(),8);
  $('#aptM2').innerHTML=Object.entries(S.aptM2).sort((a,b)=>b[1].q[1]-a[1].q[1]).map(([k,v])=>{const sc=z=>Math.min(100,z/10000*100);
    return `<div class="b"><span>${esc(ZONES()[k]||k)} <span class="note">n=${v.n}</span></span><span class="tr"><span class="iq" style="left:${sc(v.q[0])}%;width:${sc(v.q[2])-sc(v.q[0])}%"></span><span class="md" style="left:${sc(v.q[1])}%"></span></span><span class="num">${eur(v.q[1])}/m²</span></div>`;}).join('')+`<p class="note">${t('m2.scale')}</p>`;
  const sv=d3.select('#scatter');sv.selectAll('*').remove();const w=560,h=400,m={l:56,r:14,t:10,b:40};
  const pts=H.filter(r=>r.mp>0&&r.adj>0);
  const x=d3.scaleLog().domain([1000,4e6]).range([m.l,w-m.r]).clamp(true),y=d3.scaleLog().domain([1000,1e7]).range([h-m.b,m.t]).clamp(true);
  const ticks=[1e3,1e4,1e5,1e6],lab=v=>v>=1e6?(v/1e6)+' M€':(v/1e3)+' k€';
  sv.append('g').attr('class','gridl').selectAll('line').data(ticks).join('line').attr('x1',d=>x(d)).attr('x2',d=>x(d)).attr('y1',m.t).attr('y2',h-m.b);
  sv.append('g').attr('class','gridl').selectAll('line').data([...ticks,1e7]).join('line').attr('y1',d=>y(d)).attr('y2',d=>y(d)).attr('x1',m.l).attr('x2',w-m.r);
  sv.append('g').attr('class','axis').attr('transform',`translate(0,${h-m.b})`).call(d3.axisBottom(x).tickValues(ticks).tickFormat(lab));
  sv.append('g').attr('class','axis').attr('transform',`translate(${m.l},0)`).call(d3.axisLeft(y).tickValues([...ticks,1e7]).tickFormat(lab));
  [[1,t('sc.eq')],[2,'×2'],[4,'×4']].forEach(([k,tx])=>{const x0=1000,x1=Math.min(4e6,1e7/k);
    sv.append('line').attr('x1',x(x0)).attr('y1',y(x0*k)).attr('x2',x(x1)).attr('y2',y(x1*k)).attr('stroke',css('--faint')).attr('stroke-dasharray','4 4').attr('fill','none');
    const lx=k===1?2.2e6:1.4e3;sv.append('text').attr('x',x(lx)+(k===1?0:4)).attr('y',y(lx*k)+(k===1?14:-6)).attr('text-anchor',k===1?'end':'start').attr('fill',css('--muted')).attr('font-size',11).text(tx);});
  sv.append('g').selectAll('circle').data(pts).join('circle').attr('cx',d=>x(d.mp)).attr('cy',d=>y(d.adj)).attr('r',3.2).attr('fill',d=>catColor(d.cat)).attr('fill-opacity',.7)
    .append('title').text(d=>`${d.name}, ${d.city} (${d.dep})\n${eur(d.mp)} → ${eur(d.adj)} · ${d.date}`);
  sv.append('text').attr('x',w-m.r).attr('y',h-6).attr('text-anchor','end').attr('fill',css('--muted')).attr('font-size',11).text(t('sc.x'));
  sv.append('text').attr('x',m.l+4).attr('y',m.t+10).attr('fill',css('--muted')).attr('font-size',11).text(t('sc.y'));
  $('#slegend').innerHTML=[...new Set(pts.map(p=>p.cat))].map(c=>`<span><i style="background:var(--c-${c})"></i>${CATS()[c]||c}</span>`).join('');
}
function strategy(){const law=$('#gLaw').value;$('#gFees').innerHTML=feeRows(+$('#gBid').value||0,{pre:+$('#gPre').value||0,dm:+$('#gDm').value,law:law===''?null:+law});}
