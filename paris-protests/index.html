<title>Paris dans la rue</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Montserrat:wght@400;500;600;700;800&family=Noto+Sans+SC:wght@400;700&display=swap">
<style>
/* Layout: civic band header over a map pane + dated agenda; stacks map-over-list on phones.
   Look: Ville de Paris public charter cues: Montserrat throughout, anthracite blue (C100 M40 J0 N80 ≈ #001F33)
   as the brand colour, white surfaces, flat rectangles. No municipal logo or name: independent project. */
:root {
  --bg: #f4f5f6;
  --paper: #ffffff;
  --land: #eef0f2;
  --land-line: #c8ced5;
  --water: #b3cde3;
  --road-minor: #ffffff;
  --road-main: #ffffff;
  --road-motor: #f7d9a8;
  --road-case: #c9d0d8;
  --stn: #ffffff;
  --ink: #001f33;
  --muted: #4b5a68;
  --rule: #dde1e5;
  --enamel: #001f33;
  --enamel-ink: #ffffff;
  --band-sub: #9fb6c9;
  --link: #001f33;
  --k-march: #0b63c5;
  --k-rally: #c26a00;
  --k-strike: #c4245b;
  --k-blockade: #00806a;
  --k-disruption: #6a4fa3;
  --halo: #ffffff;
  --font-display: "Montserrat", "Helvetica Neue", Arial, "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
  --font-body: "Montserrat", "Helvetica Neue", Arial, "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
  --font-mono: "Montserrat", "Helvetica Neue", Arial, "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
  --font-plaque: "Barlow Condensed", "Arial Narrow", "Noto Sans SC", "PingFang SC", sans-serif;
  --plaque: #1f3f78;
  --plaque-frame: #1d4a34;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #07131d; --road-minor: #24384b; --road-main: #2c4459; --road-motor: #5b4a2c; --road-case: #0a1a27; --stn: #0e1e2b; --paper: #0e1e2b; --land: #142636; --land-line: #2b4054; --water: #1f4060;
    --ink: #e8eef3; --muted: #9fb0bf; --rule: #22374a; --enamel: #001f33; --enamel-ink: #ffffff; --band-sub: #9fb6c9; --link: #8cc4f5;
    --k-march: #6aa8f5; --k-rally: #f0a540; --k-strike: #f06d97; --k-blockade: #3cc4a8; --k-disruption: #b49be8; --halo: #0e1e2b;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #07131d; --road-minor: #24384b; --road-main: #2c4459; --road-motor: #5b4a2c; --road-case: #0a1a27; --stn: #0e1e2b; --paper: #0e1e2b; --land: #142636; --land-line: #2b4054; --water: #1f4060;
  --ink: #e8eef3; --muted: #9fb0bf; --rule: #22374a; --enamel: #001f33; --enamel-ink: #ffffff; --band-sub: #9fb6c9; --link: #8cc4f5;
  --k-march: #6aa8f5; --k-rally: #f0a540; --k-strike: #f06d97; --k-blockade: #3cc4a8; --k-disruption: #b49be8; --halo: #0e1e2b;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 14px; line-height: 1.5; }
.wrap { max-width: 1400px; margin: 0 auto; padding-inline: 16px; padding-block: 16px 32px; display: grid; gap: 14px; }

.band { background: var(--enamel); color: var(--enamel-ink); padding-inline: 16px; padding-block: 14px 16px; border-bottom: 4px solid var(--k-march); }
.band-in { max-width: 1400px; margin: 0 auto; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 16px; }
/* Title as a Paris street-name plaque: enamel blue, thin white inner rule, dark green cast frame. */
.sign { display: inline-grid; justify-items: center; gap: 1px; min-width: 0; max-width: 100%;
  background: var(--plaque); color: #ffffff; padding: 5px 18px 7px;
  border: 4px solid var(--plaque-frame); border-radius: 7px;
  box-shadow: inset 0 0 0 2px var(--plaque), inset 0 0 0 4px #ffffff, 0 2px 0 rgba(0,0,0,.35); }
.sign small { font: 600 13px/1.1 var(--font-plaque); letter-spacing: .1em; text-transform: uppercase; opacity: .92; text-align: center; }
.sign small::after { content: ""; display: block; width: 60%; height: 1px; background: rgba(255,255,255,.7); margin: 3px auto 1px; }
.sign h1 { margin: 0; font: 700 clamp(28px, 4.6vw, 44px)/1 var(--font-plaque); letter-spacing: .015em; text-align: center; text-wrap: balance; }
.lang { position: relative; display: inline-flex; align-items: center; gap: 6px; border: 1.5px solid rgba(255,255,255,.6); border-radius: 4px; padding-inline: 10px 6px; color: #ffffff; }
.lang select { font: 700 13px var(--font-body); color: #ffffff; background: transparent; border: 0; padding: 8px 22px 8px 2px; appearance: none; -webkit-appearance: none; cursor: pointer;
  background-image: linear-gradient(45deg, transparent 50%, #ffffff 50%), linear-gradient(135deg, #ffffff 50%, transparent 50%);
  background-position: calc(100% - 9px) 52%, calc(100% - 4px) 52%; background-size: 5px 5px; background-repeat: no-repeat; }
.lang select option { color: #001f33; background: #ffffff; }
.lang:focus-within { outline: 2px solid #ffffff; outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
header.top { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px 24px; }
.lede { margin: 0; max-width: 70ch; color: var(--muted); font-size: 14.5px; line-height: 1.6; }
.lede b { color: var(--ink); font-weight: 600; }

.controls { display: flex; flex-wrap: wrap; gap: 8px 18px; align-items: center; }
.group { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.group > span { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); margin-right: 2px; }
.chip { font: 600 13px var(--font-body); border: 1.5px solid var(--ink); background: var(--paper); color: var(--ink); border-radius: 4px; padding: 5px 12px; cursor: pointer; display: inline-flex; gap: 6px; align-items: center; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.chip:hover { box-shadow: inset 0 -3px 0 var(--k-march); }
.chip:focus-visible, .ctl:focus-visible, .item:focus-visible { outline: 2px solid var(--k-march); outline-offset: 2px; }

.main { display: grid; grid-template-columns: minmax(0, 1fr) 400px; gap: 14px; align-items: start; }
@media (max-width: 900px) { .main { grid-template-columns: minmax(0, 1fr); } }

.mapbox { position: relative; background: var(--paper); border: 1px solid var(--rule); border-radius: 0; overflow: hidden; min-width: 0; }
@media (min-width: 901px) { .mapbox { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 12px); } }
#map { display: block; width: 100%; height: auto; aspect-ratio: 1000 / 610; max-width: 100%; touch-action: none; cursor: grab; -webkit-user-select: none; user-select: none; }
.mfilters { display: none; }
@media (max-width: 700px) {
  /* Phone layout: filters as two drop-downs, then a near-full-screen map, then intro, agenda, footer. */
  header.top, .main { display: contents; }
  .controls { order: 1; width: 100%; }
  .mapbox { order: 2; margin-inline: -16px; border-inline: 0; }
  .lede { order: 3; }
  aside.list { order: 4; }
  footer.note { order: 5; }
  .controls .group { display: none; }
  .mfilters { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; width: 100%; }
  #map { aspect-ratio: auto; height: calc(100vh - 128px); height: calc(100svh - 128px); min-height: 440px; }
  .band { padding-block: 10px 12px; }
  .band-in { flex-wrap: nowrap; gap: 10px; }
  .sign { padding: 4px 12px 6px; min-width: 0; flex: 0 1 auto; }
  .sign h1 { font-size: min(27px, 6vw); white-space: nowrap; }
  .sign small { font-size: 9.5px; line-height: 1.45; letter-spacing: .06em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
  .lang { flex: none; padding-inline: 8px 2px; }
  .lang svg { display: none; }
  .lang select { font-size: 12.5px; padding-right: 20px; }
}
@media (max-width: 360px) {
  .band-in { flex-wrap: wrap; }
  .sign h1 { font-size: 24px; }
}
.mctl { position: relative; display: grid; gap: 2px; min-width: 0; border: 1.5px solid var(--ink); border-radius: 4px; background: var(--paper); padding: 5px 10px 6px; }
.mlab { font-size: 10px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.mctl select { font: 700 14px var(--font-body); color: var(--ink); background: transparent; border: 0; padding: 0 18px 0 0; appearance: none; -webkit-appearance: none; width: 100%; min-width: 0; text-overflow: ellipsis;
  background-image: linear-gradient(45deg, transparent 50%, currentColor 50%), linear-gradient(135deg, currentColor 50%, transparent 50%);
  background-position: calc(100% - 7px) 55%, calc(100% - 2px) 55%; background-size: 5px 5px; background-repeat: no-repeat; }
.mctl:focus-within { outline: 2px solid var(--k-march); outline-offset: 1px; }
.mtype summary { list-style: none; display: grid; gap: 2px; cursor: pointer; }
.mtype summary::-webkit-details-marker { display: none; }
#typesum { font-weight: 700; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding-right: 18px;
  background-image: linear-gradient(45deg, transparent 50%, currentColor 50%), linear-gradient(135deg, currentColor 50%, transparent 50%);
  background-position: calc(100% - 7px) 55%, calc(100% - 2px) 55%; background-size: 5px 5px; background-repeat: no-repeat; }
.mtype-list { position: absolute; z-index: 20; right: -1.5px; top: calc(100% + 4px); min-width: 100%; width: max-content; max-width: calc(100vw - 32px); background: var(--paper); border: 1.5px solid var(--ink); border-radius: 4px; padding: 6px; display: grid; gap: 2px; box-shadow: 0 6px 18px rgba(0,0,0,.18); }
.mtype-list label { display: flex; align-items: center; gap: 10px; padding: 9px 8px; font-weight: 600; font-size: 14px; cursor: pointer; border-radius: 3px; }
.mtype-list label:hover { background: color-mix(in srgb, var(--ink) 6%, transparent); }
.mtype-list input { width: 18px; height: 18px; accent-color: var(--ink); margin: 0; }
.hint { position: absolute; left: 10px; top: 10px; right: 56px; width: fit-content; background: color-mix(in srgb, var(--paper) 92%, transparent); border: 1px solid var(--rule); font-size: 11.5px; font-weight: 600; padding: 4px 8px; pointer-events: none; transition: opacity .4s; }
.hint.gone { opacity: 0; }
.ctl[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.road { fill: none; stroke-linecap: round; stroke-linejoin: round; vector-effect: non-scaling-stroke; }
.road.case { stroke: var(--road-case); }
.road.r2 { stroke: var(--road-minor); }
.road.r1 { stroke: var(--road-main); }
.road.r0 { stroke: var(--road-motor); }
#map:not(.z-lm) .lm2 { display: none; }
#map:active { cursor: grabbing; }
.zoom { position: absolute; right: 10px; top: 10px; display: flex; flex-direction: column; gap: 4px; }
.ctl { width: 34px; height: 34px; border-radius: 4px; border: 1px solid var(--rule); background: var(--paper); color: var(--ink); font: 600 16px/1 var(--font-body); cursor: pointer; }
.legend { position: absolute; left: 10px; bottom: 10px; background: color-mix(in srgb, var(--paper) 94%, transparent); border: 1px solid var(--rule); border-radius: 2px; padding: 6px 9px; font-size: 11.5px; }
.ring { width: 11px; height: 11px; border-radius: 50%; border: 1.5px dashed var(--muted); display: inline-block; }
.legend summary { font-weight: 700; font-size: 11px; text-transform: uppercase; letter-spacing: .08em; cursor: pointer; }
.legend[open] summary { margin-bottom: 4px; }
.lg-grid { display: grid; grid-template-columns: auto auto; gap: 3px 14px; }
.lg-grid div { display: flex; gap: 6px; align-items: center; }
.ic { flex: none; display: inline-block; vertical-align: middle; }
@media (max-width: 520px) { .legend { font-size: 10.5px; padding: 4px 7px; max-width: calc(100% - 20px); } .lg-grid { gap: 2px 10px; grid-template-columns: repeat(3, auto); } }
.toast { position: absolute; left: 50%; bottom: 14px; transform: translateX(-50%); max-width: calc(100% - 32px); background: var(--ink); color: var(--paper); font-size: 12.5px; font-weight: 600; padding: 7px 12px; border-radius: 4px; box-shadow: 0 4px 14px rgba(0,0,0,.25); opacity: 0; pointer-events: none; transition: opacity .3s; text-align: center; }
.toast.on { opacity: 1; }
#locate { display: grid; place-items: center; padding: 0; }
.me-acc { fill: #1a73e8; fill-opacity: .12; stroke: #1a73e8; stroke-opacity: .5; stroke-width: 1; vector-effect: non-scaling-stroke; }
.me-dot { fill: #1a73e8; stroke: #ffffff; stroke-width: 2.5; }
.me-halo { fill: #1a73e8; opacity: .3; transform-box: fill-box; transform-origin: center; animation: pulse 2s ease-out infinite; }
@media (prefers-reduced-motion: reduce) { .me-halo { animation: none; } }

.arr { fill: var(--land); stroke: var(--land-line); stroke-width: 1; vector-effect: non-scaling-stroke; }
.seine { fill: none; stroke: var(--water); stroke-linecap: round; stroke-linejoin: round; }
.lm2 text { font-weight: 500; font-style: italic; }
.arrnum { font: 700 14px var(--font-display); fill: var(--muted); opacity: .55; text-anchor: middle; dominant-baseline: middle; pointer-events: none; }
.lm { font: 600 10.5px var(--font-body); fill: var(--ink); paint-order: stroke; stroke: var(--halo); stroke-width: 3px; pointer-events: none; }
.lmdot { fill: var(--ink); }
.route { fill: none; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; vector-effect: non-scaling-stroke; opacity: .85; }
.route.sel { stroke-width: 6.5; opacity: 1; }
.route.past { opacity: .35; stroke-dasharray: 2 5; }
.mk { cursor: pointer; }
.mk .hit { fill: transparent; }
.mk .shape { stroke: var(--halo); stroke-width: 1.8; }
.mk .glyph { fill: #ffffff; pointer-events: none; }
.mk .pulse { transform-box: fill-box; transform-origin: center; }
.mk.unconfirmed .shape { stroke: var(--ink); stroke-dasharray: 3 2; stroke-width: 1.5; }
.mk.past { opacity: .4; }
.mk.sel .shape { stroke: var(--ink); stroke-width: 3; }
.mk .pulse { fill: none; stroke-width: 2; opacity: 0; }
.mk.live .pulse { animation: pulse 2s ease-out infinite; }
@keyframes pulse { 0% { opacity: .8; transform: scale(.6); } 100% { opacity: 0; transform: scale(1.8); } }
@media (prefers-reduced-motion: reduce) { .mk.live .pulse { animation: none; opacity: .5; } }
.endcap { stroke: var(--halo); stroke-width: 1.5; }

aside.list { background: var(--paper); border: 1px solid var(--rule); border-top: 4px solid var(--ink); min-width: 0; }
.list h2 { margin: 0; padding: 12px 14px 10px; font: 800 18px var(--font-display); letter-spacing: .06em; text-transform: uppercase; border-bottom: 1px solid var(--rule); display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.list h2 span { font: 600 12px var(--font-body); font-variant-numeric: tabular-nums; color: var(--muted); text-transform: none; letter-spacing: 0; }
.daygroup { border-bottom: 1px solid var(--rule); }
.daygroup:last-child { border-bottom: 0; }
.dayhead { padding: 10px 14px 2px; font: 700 11.5px var(--font-body); color: var(--ink); text-transform: uppercase; letter-spacing: .08em; font-variant-numeric: tabular-nums; display: flex; gap: 8px; align-items: center; }
.dayhead .now { font-weight: 700; letter-spacing: .06em; background: var(--k-march); color: #ffffff; border-radius: 2px; padding: 1px 6px; }
.item { display: grid; grid-template-columns: 18px minmax(0,1fr); gap: 11px; padding: 9px 14px 11px; cursor: pointer; }
.item:hover { background: color-mix(in srgb, var(--ink) 4%, transparent); }
.item.sel { background: color-mix(in srgb, var(--k-march) 10%, transparent); box-shadow: inset 3px 0 0 var(--ink); }
.item .bar { padding-top: 1px; }
.item.past { opacity: .62; }
.item h3 { margin: 0; font-size: 14.5px; font-weight: 700; line-height: 1.3; text-wrap: balance; }
.meta { display: flex; flex-wrap: wrap; gap: 4px 10px; margin-top: 3px; color: var(--muted); font-size: 12.5px; }
.meta .t { font-weight: 600; font-size: 12.5px; color: var(--ink); font-variant-numeric: tabular-nums; }
.pill { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; border-radius: 2px; padding: 0 5px; border: 1px solid currentColor; }
.pill.confirmed { color: var(--k-blockade); }
.pill.announced { color: var(--k-rally); }
.pill.unconfirmed { color: var(--k-strike); border-style: dashed; }
.pill.offmap { color: var(--muted); }
.detail { margin-top: 7px; display: grid; gap: 6px; font-size: 13px; }
.detail p { margin: 0; max-width: 60ch; }
.detail .route-txt { font-size: 12.5px; color: var(--muted); }
.detail .impact { font-size: 12.5px; }
.detail .src { font-size: 12px; display: flex; flex-wrap: wrap; gap: 4px 10px; }
.detail .src a { color: var(--link); text-underline-offset: 2px; }
.empty { padding: 18px 14px; color: var(--muted); }

footer.note { color: var(--muted); font-size: 12.5px; border-top: 1px solid var(--rule); padding-top: 12px; display: grid; gap: 4px; max-width: 95ch; }
footer.note p { margin: 0; }
</style>

<div class="band">
  <div class="band-in">
    <div class="sign"><small data-i18n="kicker"></small><h1>Paris dans la rue</h1></div>
    <label class="lang"><span class="sr" data-i18n="language"></span>
      <svg aria-hidden="true" viewBox="0 0 24 24" width="16" height="16"><path fill="none" stroke="currentColor" stroke-width="2" d="M12 3a9 9 0 1 0 0 18 9 9 0 0 0 0-18Zm-9 9h18M12 3c2.5 2.6 3.7 5.6 3.7 9s-1.2 6.4-3.7 9c-2.5-2.6-3.7-5.6-3.7-9S9.5 5.6 12 3Z"/></svg>
      <select id="langsel">
        <option value="fr" lang="fr">Français</option><option value="en" lang="en">English</option><option value="es" lang="es">Español</option>
        <option value="zh" lang="zh">中文（普通话）</option><option value="pt" lang="pt">Português</option><option value="de" lang="de">Deutsch</option>
      </select>
    </label>
  </div>
</div>
<div class="wrap">
  <header class="top">
    <p class="lede" data-i18n-html="lede"></p>
    <div class="controls" role="toolbar">
      <div class="group" id="f-when"><span data-i18n="when"></span></div>
      <div class="group" id="f-kind"><span data-i18n="type"></span></div>
      <div class="mfilters">
        <label class="mctl"><span class="mlab" data-i18n="when"></span><select id="whensel"></select></label>
        <details class="mctl mtype" id="typedd"><summary><span class="mlab" data-i18n="type"></span><span id="typesum"></span></summary><div class="mtype-list" id="typelist"></div></details>
      </div>
    </div>
  </header>

  <div class="main">
    <div class="mapbox">
      <svg id="map" viewBox="0 0 1000 610" role="img"></svg>
      <div class="hint" id="hint" data-i18n="hint"></div>
      <div class="zoom">
        <button class="ctl" id="zin">+</button>
        <button class="ctl" id="zout">−</button>
        <button class="ctl" id="zreset" style="font-size:12px">⤢</button>
        <button class="ctl" id="locate" aria-pressed="false"><svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><circle cx="12" cy="12" r="4" fill="currentColor"/><circle cx="12" cy="12" r="8" fill="none" stroke="currentColor" stroke-width="2"/><path d="M12 1v4M12 19v4M1 12h4M19 12h4" stroke="currentColor" stroke-width="2"/></svg></button>
      </div>
      <details class="legend" id="legend" open><summary data-i18n="legend"></summary><div class="lg-grid" id="lggrid"></div></details>
      <div class="toast" id="geomsg" role="status" aria-live="polite"></div>
    </div>
    <aside class="list">
      <h2><span data-i18n="agenda" style="font:inherit;color:inherit;text-transform:inherit;letter-spacing:inherit"></span> <span id="count"></span></h2>
      <div id="items"></div>
    </aside>
  </div>

  <footer class="note">
    <p data-i18n="foot1"></p>
    <p data-i18n="foot2"></p>
    <p data-i18n="foot3"></p>
    <p data-i18n="foot4"></p>
  </footer>
</div>

  desc:{fr:"L'intersyndicale (dont CFDT, CGT, FO, Unsa, FSU) appelle salariés, retraités et jeunes à faire grève et à manifester contre les mesures du budget 2027 et pour les services publics, dans la suite du 29 septembre et des blocages de lycées et d'universités.",en:"The union coalition (including CFDT, CGT, FO, Unsa, FSU) calls workers, retirees and young people to strike and march against the 2027 budget measures and for public services, following 29 September and the school and university blockades.",es:"La intersindical (entre ellas CFDT, CGT, FO, Unsa, FSU) llama a trabajadores, jubilados y jóvenes a la huelga y a manifestarse contra las medidas del presupuesto 2027 y por los servicios públicos, tras el 29 de septiembre y los bloqueos de institutos y universidades.",zh:"工会联盟（包括 CFDT、CGT、FO、Unsa、FSU）号召雇员、退休人员和青年罢工并游行，反对2027年预算措施、捍卫公共服务，延续9月29日行动及中学和大学封锁。",pt:"A intersindical (incluindo CFDT, CGT, FO, Unsa, FSU) apela a trabalhadores, reformados e jovens para fazer greve e manifestar-se contra as medidas do orçamento de 2027 e pelos serviços públicos, na sequência de 29 de setembro e dos bloqueios de liceus e universidades.",de:"Das Gewerkschaftsbündnis (u. a. CFDT, CGT, FO, Unsa, FSU) ruft Beschäftigte, Rentner und junge Menschen zu Streik und Demonstrationen gegen die Maßnahmen des Haushalts 2027 und für den öffentlichen Dienst auf – im Anschluss an den 29. September und die Schul- und Uniblockaden."},
  impact:{fr:"Les quatre principaux syndicats de la SNCF (CGT-Cheminots, UNSA-Ferroviaire, SUD-Rail, CFDT-Cheminots) appellent aussi à la grève le 5 novembre : trains, RER et Transilien probablement perturbés ; prévisions SNCF la veille à partir de 17 h. Aucun préavis RATP signalé à ce stade.",en:"The four main SNCF unions (CGT-Cheminots, UNSA-Ferroviaire, SUD-Rail, CFDT-Cheminots) also call a strike on 5 November: trains, RER and Transilien likely disrupted; SNCF forecasts the day before from 5 pm. No RATP strike notice reported so far.",es:"Los cuatro principales sindicatos de la SNCF (CGT-Cheminots, UNSA-Ferroviaire, SUD-Rail, CFDT-Cheminots) también convocan huelga el 5 de noviembre: trenes, RER y Transilien probablemente afectados; previsiones de la SNCF la víspera a partir de las 17 h. Por ahora no hay preaviso en la RATP.",zh:"SNCF 四大工会（CGT-Cheminots、UNSA-Ferroviaire、SUD-Rail、CFDT-Cheminots）也号召11月5日罢工：火车、RER 和 Transilien 可能受影响；SNCF 将于前一天17时起公布预测。目前未见 RATP 罢工预告。",pt:"Os quatro principais sindicatos da SNCF (CGT-Cheminots, UNSA-Ferroviaire, SUD-Rail, CFDT-Cheminots) também convocam greve a 5 de novembro: comboios, RER e Transilien provavelmente perturbados; previsões da SNCF na véspera a partir das 17 h. Nenhum pré-aviso na RATP até agora.",de:"Auch die vier großen SNCF-Gewerkschaften (CGT-Cheminots, UNSA-Ferroviaire, SUD-Rail, CFDT-Cheminots) rufen für den 5. November zum Streik auf: Züge, RER und Transilien voraussichtlich gestört; SNCF-Prognose am Vortag ab 17 Uhr. Bisher keine Streikankündigung bei der RATP."},

  desc:{fr:"Troisième samedi de mobilisation contre la vie chère (« acte III »). La préfecture de police avait refusé les tracés Bastille → Concorde des Gilets jaunes et Bastille → Nation de la CGT et de l'intersyndicale. Vendredi soir, le tribunal administratif a autorisé Bastille → Nation ; la préfecture a fait appel et, dans la nuit, le Conseil d'État a annulé cette décision et validé le parcours porte de Bagnolet → porte de Charenton, selon BFMTV.",en:"Third Saturday of protest against the cost of living (\"act III\"). The Préfecture de police had refused the gilets jaunes' Bastille → Concorde route and the CGT/union coalition's Bastille → Nation route. On Friday evening the administrative court allowed Bastille → Nation; the Préfecture appealed and overnight the Conseil d'État overturned that ruling and upheld the porte de Bagnolet → porte de Charenton route, according to BFMTV.",es:"Tercer sábado de movilización contra la carestía de la vida («acto III»). La Prefectura de Policía había rechazado el recorrido Bastille → Concorde de los chalecos amarillos y el Bastille → Nation de la CGT y la intersindical. El viernes por la noche el tribunal administrativo autorizó Bastille → Nation; la Prefectura recurrió y, de madrugada, el Conseil d'État anuló esa decisión y validó el recorrido porte de Bagnolet → porte de Charenton, según BFMTV.",zh:"第三个反对生活成本上涨的行动周六（“第三幕”）。巴黎警察局此前拒绝了黄背心的 Bastille → Concorde 路线以及 CGT 和工会联盟的 Bastille → Nation 路线。周五晚，行政法院批准了 Bastille → Nation；警察局提起上诉，据 BFMTV 报道，Conseil d'État 于当夜撤销该裁决，确认 porte de Bagnolet → porte de Charenton 路线。",pt:"Terceiro sábado de mobilização contra o custo de vida («ato III»). A Prefeitura de Polícia tinha recusado o percurso Bastille → Concorde dos coletes amarelos e o Bastille → Nation da CGT e da intersindical. Na sexta à noite o tribunal administrativo autorizou Bastille → Nation; a Prefeitura recorreu e, durante a noite, o Conseil d'État anulou essa decisão e validou o percurso porte de Bagnolet → porte de Charenton, segundo a BFMTV.",de:"Dritter Protestsamstag gegen die hohen Lebenshaltungskosten („Akt III“). Die Polizeipräfektur hatte die Route Bastille → Concorde der Gelbwesten und Bastille → Nation von CGT und Gewerkschaftsbündnis abgelehnt. Am Freitagabend erlaubte das Verwaltungsgericht Bastille → Nation; die Präfektur legte Berufung ein, und in der Nacht hob der Conseil d'État diese Entscheidung laut BFMTV auf und bestätigte die Route porte de Bagnolet → porte de Charenton."},
  src:[["Cedarnews / BFMTV","https://cedarnews.net/francais/1106539/manifestation-du-31-octobre-a-paris-le-conseil-detat-valide-le-parcours-bagnolet-charenton/"],["franceinfo","https://www.franceinfo.fr/societe/manifestations/la-prefecture-nous-balade-a-paris-le-parcours-de-la-manifestation-du-31-octobre-au-c-ur-d-un-bras-de-fer-judiciaire_8260127.html"],["France 3 Paris IDF","https://france3-regions.franceinfo.fr/paris-ile-de-france/manifestation-du-31-octobre-a-paris-parcours-declares-interdictions-dispositif-de-securite-ce-que-l-on-sait-sur-la-mobilisation-contre-la-vie-chere-3441171.html"],["Sortiraparis (métro)","https://www.sortiraparis.com/en/news/in-paris/articles/355777-october-31-demonstration-more-than-33-metro-and-rer-stations-closed-this-saturday"],["Sortiraparis (gares)","https://sortiraparis.com/actualites/a-paris/articles/356538-manifestation-du-31-octobre-gare-du-nord-et-gare-de-lyon-sous-protection"]],
  impact:{fr:"Plus de 30 stations de métro et RER fermées samedi selon la RATP (liste susceptible d'évoluer) ; gare du Nord et gare de Lyon sous protection. Rassemblements non déclarés interdits jusqu'à lundi autour de l'Élysée, de l'Assemblée nationale et des Champs-Élysées.",en:"More than 30 metro and RER stations closed on Saturday according to RATP (list may change); gare du Nord and gare de Lyon under protection. Undeclared gatherings banned until Monday around the Élysée, the Assemblée nationale and the Champs-Élysées.",es:"Más de 30 estaciones de metro y RER cerradas el sábado según la RATP (lista sujeta a cambios); gare du Nord y gare de Lyon bajo protección. Concentraciones no declaradas prohibidas hasta el lunes alrededor del Élysée, la Assemblée nationale y los Champs-Élysées.",zh:"据 RATP，周六有30多个地铁和 RER 站关闭（名单可能变化）；gare du Nord 和 gare de Lyon 受到保护。至周一前，Élysée、Assemblée nationale 和 Champs-Élysées 周边禁止未申报的集会。",pt:"Mais de 30 estações de metro e RER fechadas no sábado segundo a RATP (lista sujeita a alterações); gare du Nord e gare de Lyon sob proteção. Concentrações não declaradas proibidas até segunda-feira à volta do Élysée, da Assemblée nationale e dos Champs-Élysées.",de:"Laut RATP am Samstag mehr als 30 Metro- und RER-Stationen geschlossen (Liste kann sich ändern); gare du Nord und gare de Lyon unter Schutz. Nicht angemeldete Versammlungen bis Montag rund um Élysée, Assemblée nationale und Champs-Élysées verboten."},

const KIND_KEYS=["march","rally","strike","blockade","disruption"];

/* ---------- language ---------- */
function pickLang(){
  const h=(location.hash||"").replace("#","").toLowerCase();
  return UI[h]?h:"fr";
}
let LANG=pickLang();
const T=k=>UI[LANG][k];
const L=o=>o?(o[LANG]||o.en||o.fr):"";

/* ---------- dates ---------- */
const pad=n=>String(n).padStart(2,"0");
const now=new Date(); const TODAY=`${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())}`;
const addDays=(iso,d)=>{const t=new Date(iso+"T12:00:00");t.setDate(t.getDate()+d);return `${t.getFullYear()}-${pad(t.getMonth()+1)}-${pad(t.getDate())}`;};
const WEEK=addDays(TODAY,7);
function phase(e){const end=e.end||e.date; if(end<TODAY) return "past"; if(e.date<=TODAY) return "live"; return e.date<=WEEK?"soon":"later";}
const fmtDay=iso=>new Date(iso+"T12:00:00").toLocaleDateString(LOCALE[LANG],{weekday:"short",day:"numeric",month:"short"});

/* ---------- filters ---------- */
const WHEN=["upcoming","soon","all","past"];
let state={when:"upcoming",kinds:new Set(KIND_KEYS),sel:null};
try{const s=JSON.parse(localStorage.getItem("pdlr-filters")||"null"); if(s){if(WHEN.includes(s.when)) state.when=s.when; if(Array.isArray(s.kinds)&&s.kinds.length) state.kinds=new Set(s.kinds.filter(k=>KIND_KEYS.includes(k)));}}catch(_){}
if(!state.kinds.size) state.kinds=new Set(KIND_KEYS);
function save(){try{localStorage.setItem("pdlr-filters",JSON.stringify({when:state.when,kinds:[...state.kinds]}));}catch(_){}}
function visible(e){
  if(!state.kinds.has(e.kind)) return false;
  const p=phase(e);
  if(state.when==="upcoming") return p!=="past";
  if(state.when==="soon") return p==="live"||p==="soon";
  if(state.when==="past") return p==="past";
  return true;
}
const fw=document.getElementById("f-when"), fk=document.getElementById("f-kind");
WHEN.forEach(k=>{const b=document.createElement("button");b.className="chip";b.id="when-"+k;b.onclick=()=>{state.when=k;save();render();};fw.appendChild(b);});
KIND_KEYS.forEach(k=>{const b=document.createElement("button");b.className="chip";b.id="kind-"+k;b.onclick=()=>{state.kinds.has(k)?state.kinds.delete(k):state.kinds.add(k); if(!state.kinds.size) state.kinds.add(k); save();render();};fk.appendChild(b);});

document.getElementById("whensel").addEventListener("change",e=>{state.when=e.target.value;save();render();});
document.getElementById("typelist").addEventListener("change",e=>{const k=e.target.value; e.target.checked?state.kinds.add(k):state.kinds.delete(k); if(!state.kinds.size){state.kinds.add(k);} save();render();});
document.addEventListener("click",e=>{const d=document.getElementById("typedd"); if(d.open&&!d.contains(e.target)) d.open=false;});
function applyLang(){
  document.documentElement.lang=LANG;
  document.querySelectorAll("[data-i18n]").forEach(el=>el.textContent=T(el.dataset.i18n));
  document.querySelectorAll("[data-i18n-html]").forEach(el=>el.innerHTML=T(el.dataset.i18nHtml).replace("{date}",new Date(UPDATED+"T12:00:00").toLocaleDateString(LOCALE[LANG],{day:"numeric",month:"long",year:"numeric"})));
  WHEN.forEach(k=>document.getElementById("when-"+k).textContent=T(k));
  KIND_KEYS.forEach(k=>document.getElementById("kind-"+k).innerHTML=`${icon(k,17)}${T(k)}`);
  document.getElementById("lggrid").innerHTML=KIND_KEYS.map(k=>`<div>${icon(k)}<span>${T(k)}</span></div>`).join("")
    +`<div>${icon("rally",18,'style="filter:grayscale(1)"').replace('stroke="var(--halo)" stroke-width="1.5"','stroke="var(--ink)" stroke-width="1.6" stroke-dasharray="3 2"')}<span>${T("unconfirmed")}</span></div>`
    +`<div>${icon("rally",18,'style="opacity:.4"')}<span>${T("lgPast")}</span></div>`;
  document.getElementById("whensel").innerHTML=WHEN.map(k=>`<option value="${k}">${T(k)}</option>`).join("");
  document.getElementById("typelist").innerHTML=KIND_KEYS.map(k=>`<label><input type="checkbox" value="${k}">${icon(k)}${T(k)}</label>`).join("");
  ["zin","zout","zreset","locate"].forEach(id=>{const b=document.getElementById(id);b.setAttribute("aria-label",T(id));b.title=T(id);});
  document.getElementById("map").setAttribute("aria-label",T("mapLabel"));
  document.querySelector(".controls").setAttribute("aria-label",T("filters"));
  document.getElementById("langsel").value=LANG;
}
document.getElementById("langsel").addEventListener("change",e=>{
  LANG=e.target.value;
  try{history.replaceState(null,"","#"+LANG);}catch(_){}
  applyLang(); render();
});
window.addEventListener("hashchange",()=>{const h=location.hash.replace("#","").toLowerCase(); if(UI[h]&&h!==LANG){LANG=h;applyLang();render();}});

/* ---------- projection ---------- */
const W=1000,H=610,LON0=2.2259,LAT1=48.9013,KX=Math.cos(48.859*Math.PI/180);
const S=Math.min((W-40)/((2.4698-LON0)*KX),(H-40)/(LAT1-48.8161));
const OX=(W-(2.4698-LON0)*KX*S)/2, OY=(H-(LAT1-48.8161)*S)/2;
const P=([lon,lat])=>[OX+(lon-LON0)*KX*S, OY+(LAT1-lat)*S];
const line=pts=>"M"+pts.map(p=>P(p).map(v=>v.toFixed(1)).join(",")).join("L");

const svg=d3.select("#map"), svgEl=document.getElementById("map"), g=svg.append("g");
const gBase=g.append("g"), gRoads=g.append("g"), gWater=g.append("g"), gBridges=g.append("g"), gRoutes=g.append("g"), gLabels=g.append("g"), gMarks=g.append("g");
ARR.forEach(a=>a.r.forEach(r=>gBase.append("path").attr("class","arr").attr("d",line(r)+"Z")));
const seineSplit=SEINE.indexOf(null);
const smooth=d3.line().x(p=>P(p)[0]).y(p=>P(p)[1]).curve(d3.curveCatmullRom.alpha(0.5));
const SEINE_E=SEINE.slice(0,seineSplit), SEINE_W=SEINE.slice(seineSplit+1);
const seine=gWater.append("path").attr("class","seine").attr("d",smooth(SEINE_E)+smooth(SEINE_W));
/* The two arms of the Seine around Île de la Cité and Île Saint-Louis, then the islands drawn as land on top. */
const SEINE_N=[[2.3375,48.8583],[2.3412,48.8584],[2.3440,48.8582],[2.3468,48.8575],[2.3490,48.8567],[2.3512,48.8557],[2.3532,48.8546],[2.3556,48.8543],[2.3580,48.8538],[2.3603,48.8527],[2.3618,48.8512],[2.3640,48.8492],[2.3660,48.8463]];
const SEINE_S=[[2.3375,48.8583],[2.3400,48.8566],[2.3420,48.8553],[2.3445,48.8538],[2.3462,48.8529],[2.3485,48.8517],[2.3510,48.8508],[2.3540,48.8512],[2.3560,48.8508],[2.3580,48.8502],[2.3600,48.8496],[2.3622,48.8490],[2.3640,48.8480],[2.3660,48.8463]];
const ISLANDS=[
  [[2.3390,48.8574],[2.3412,48.8580],[2.3440,48.8575],[2.3468,48.8569],[2.3490,48.8560],[2.3512,48.8549],[2.3527,48.8535],[2.3534,48.8522],[2.3522,48.8516],[2.3505,48.8514],[2.3485,48.8522],[2.3466,48.8530],[2.3446,48.8541],[2.3425,48.8556],[2.3405,48.8566]],
  [[2.3537,48.8530],[2.3556,48.8538],[2.3580,48.8531],[2.3600,48.8521],[2.3613,48.8507],[2.3598,48.8503],[2.3575,48.8509],[2.3553,48.8517],[2.3540,48.8524]]];
const seineArms=[SEINE_N,SEINE_S].map(a=>gWater.append("path").attr("class","seine").attr("d",smooth(a)));
ISLANDS.forEach(r=>gWater.append("path").attr("class","arr isle").attr("d",line(r)+"Z"));
const flat=a=>{const o=[];for(let i=0;i<a.length;i+=2)o.push([a[i],a[i+1]]);return o;};
/* Roads come from straight IGN segments and don't follow the hand-drawn river exactly, so the water is drawn
   over them and only real crossings (bridges) and island streets are drawn again on top of the water. */
const RIVERS=[SEINE_E,SEINE_W,SEINE_N,SEINE_S].map(a=>a.map(P));
function cross(a,b,c,d){const o=(p,q,r)=>(q[0]-p[0])*(r[1]-p[1])-(q[1]-p[1])*(r[0]-p[0]);
  return o(a,b,c)*o(a,b,d)<0 && o(c,d,a)*o(c,d,b)<0;}
function angle(a,b,c,d){const u=[b[0]-a[0],b[1]-a[1]],v=[d[0]-c[0],d[1]-c[1]];
  const cs=Math.abs(u[0]*v[0]+u[1]*v[1])/(Math.hypot(...u)*Math.hypot(...v)||1);return Math.acos(Math.min(1,cs))*180/Math.PI;}
/* Returns the bridge decks for a road segment: for each real crossing, the piece of the road that spans the
   water from bank to bank (so a bridge never stops mid-river, whatever the road data's node positions). */
function bridgeDecks(a,b){
  const L=Math.hypot(b[0]-a[0],b[1]-a[1]); if(L>40) return [];     /* longer than ~700 m: a quay edge, not a bridge */
  const ux=(b[0]-a[0])/L, uy=(b[1]-a[1])/L, out=[];
  RIVERS.forEach((r,k)=>{const half=k<2?4.6:2.8;
    for(let i=0;i<r.length-1;i++){const c=r[i],d=r[i+1]; if(!cross(a,b,c,d)) continue;
      const th=angle(a,b,c,d); if(th<35) continue;
      const den=(b[0]-a[0])*(d[1]-c[1])-(b[1]-a[1])*(d[0]-c[0]); const t=((c[0]-a[0])*(d[1]-c[1])-(c[1]-a[1])*(d[0]-c[0]))/den;
      const ix=a[0]+t*(b[0]-a[0]), iy=a[1]+t*(b[1]-a[1]), h=(half+1.6)/Math.sin(th*Math.PI/180);
      out.push([[ix-ux*h,iy-uy*h],[ix+ux*h,iy+uy*h]]);}});
  return out;}
const ISLE_P=ISLANDS.map(r=>r.map(P));
function inIsle(pt){return ISLE_P.some(poly=>{let c=false;for(let i=0,j=poly.length-1;i<poly.length;j=i++){const[xi,yi]=poly[i],[xj,yj]=poly[j];
  if((yi>pt[1])!==(yj>pt[1]) && pt[0]<(xj-xi)*(pt[1]-yi)/(yj-yi)+xi) c=!c;}return c;});}
const roadD=[], bridgeD=[];
ROADS.forEach((list,ci)=>{let all="",br="";list.forEach(a=>{const pts=flat(a).map(P);
  for(let i=0;i<pts.length-1;i++){const seg=`M${pts[i][0].toFixed(1)},${pts[i][1].toFixed(1)}L${pts[i+1][0].toFixed(1)},${pts[i+1][1].toFixed(1)}`;
    all+=seg;
    if(inIsle(pts[i])&&inIsle(pts[i+1])) br+=seg;
    else bridgeDecks(pts[i],pts[i+1]).forEach(([p,q])=>{br+=`M${p[0].toFixed(1)},${p[1].toFixed(1)}L${q[0].toFixed(1)},${q[1].toFixed(1)}`;});}});
  roadD[ci]=all; bridgeD[ci]=br;});
function roadLayer(gg,D){return {cs:[0,1,2].map(i=>gg.append("path").attr("class","road case").attr("d",D[i])),
  fl:[2,1,0].map(i=>gg.append("path").attr("class","road r"+i).attr("d",D[i]))};}
const roadLayers=[roadLayer(gRoads,roadD),roadLayer(gBridges,bridgeD)];
function centroid(r){let A=0,cx=0,cy=0;const pts=r.map(P);for(let i=0;i<pts.length-1;i++){const[x0,y0]=pts[i],[x1,y1]=pts[i+1],f=x0*y1-x1*y0;A+=f;cx+=(x0+x1)*f;cy+=(y0+y1)*f;}A/=2;return[cx/(6*A),cy/(6*A)];}
const numNodes=ARR.map(a=>{const big=a.r.reduce((m,r)=>r.length>m.length?r:m,a.r[0]);const[x,y]=centroid(big);return gLabels.append("text").attr("class","arrnum").attr("data-x",x).attr("data-y",y).text(a.n+(a.n===1?"er":"e"));});
const lmNodes=LANDMARKS.concat(LANDMARKS2.map(l=>[...l,1])).map(([name,pt,side,minor])=>{const[x,y]=P(pt);const gg=gLabels.append("g").attr("class",minor?"lm2":null).attr("data-x",x).attr("data-y",y);gg.append("circle").attr("class","lmdot").attr("r",1.6);gg.append("text").attr("class","lm").attr("x",side==="r"?5:-5).attr("y",-5).attr("text-anchor",side==="r"?"start":"end").text(name);return gg;});

const color=k=>`var(--k-${k})`;
/* Map pins: a teardrop in the type's colour with a white pictogram, so a marker reads without the legend.
   Pin tip at (0,0); head centred at (0,-17). */
const PIN="M0,0C-2.5,-5 -10,-9.5 -10,-17A10,10 0 1 1 10,-17C10,-9.5 2.5,-5 0,0Z";
const GLYPH={
  march:"M-6,-1.6H0.8V-5.2L6.2,0L0.8,5.2V1.6H-6Z",                      /* arrow: a moving march */
  rally:"M-6.2,-2.4H-3L3.6,-6.4V6.4L-3,2.4H-6.2ZM4.8,-2.2H6.4V2.2H4.8Z", /* megaphone: a gathering */
  strike:"M-4.6,-5.4H-1.3V5.4H-4.6ZM1.3,-5.4H4.6V5.4H1.3Z",            /* pause: work stopped */
  blockade:"M-6,-2H6V2H-6Z",                                             /* no-entry bar: blocked */
  disruption:"M-1.7,-6.2H1.7L1.1,2H-1.1ZM-1.7,3.4H1.7V6.4H-1.7Z"};      /* exclamation: disruption */
function shape(sel,kind){
  const p=sel.append("g").attr("transform","scale(0.78)");
  p.append("path").attr("class","shape").attr("d",PIN);
  p.append("path").attr("class","glyph").attr("transform","translate(0,-17)").attr("d",GLYPH[kind]);
  return p.select(".shape");
}
function icon(kind,h=18,extra=""){
  return `<svg class="ic" viewBox="-11.5 -28.5 23 29.5" width="${(h*23/29.5).toFixed(1)}" height="${h}" aria-hidden="true" ${extra}><path d="${PIN}" fill="var(--k-${kind})" stroke="var(--halo)" stroke-width="1.5"/><path d="${GLYPH[kind]}" transform="translate(0,-17)" fill="#fff"/></svg>`;
}

let K=1, markerNodes=[];
/* "Me localiser": live position from the browser, drawn as a blue dot with its accuracy circle. */
const gMe=g.append("g").style("display","none");
const meAcc=gMe.append("circle").attr("class","me-acc");
const meDot=gMe.append("g"); meDot.append("circle").attr("class","me-halo").attr("r",10); meDot.append("circle").attr("class","me-dot").attr("r",6);
let meXY=null, geoWatch=null, msgT;
let PPU=1; /* screen px per map unit at zoom 1 */
let endcaps=[];
function placeAll(){
  const s=1/K, narrow=isNarrow();
  const ms=narrow? s*Math.max(1, 1.3/PPU) : s;    /* event icons ~10px radius on phones */
  const ls=narrow? s*Math.max(1, 0.82/PPU) : s;   /* place labels ~9px on phones */
  numNodes.forEach(n=>n.attr("transform",`translate(${n.attr("data-x")},${n.attr("data-y")}) scale(${ls})`));
  lmNodes.forEach(n=>n.attr("transform",`translate(${n.attr("data-x")},${n.attr("data-y")}) scale(${ls})`));
  if(meXY) meDot.attr("transform",`translate(${meXY[0]},${meXY[1]}) scale(${ms})`);
  markerNodes.forEach(m=>m.node.attr("transform",`translate(${m.x},${m.y}) scale(${ms}) translate(${m.dx},${m.dy})`));
  const ec=9*ms; endcaps.forEach(r=>r.attr("x",+r.attr("data-x")-ec/2).attr("y",+r.attr("data-y")-ec/2).attr("width",ec).attr("height",ec));
  seine.attr("stroke-width",Math.max(8,4/(K*PPU)));
  seineArms.forEach(a=>a.attr("stroke-width",Math.max(4.6,2.5/(K*PPU))));
  const q=Math.sqrt(K);
  roadLayers.forEach(L=>[[2,1.1],[1,1.8],[0,2.6]].forEach(([i,w],j)=>{L.fl[j].attr("stroke-width",w*q);L.cs[i].attr("stroke-width",w*q+1.4);}));
  svgEl.classList.toggle("z-lm",K>=1.8);
}

function drawMap(list){
  endcaps=[];
  gRoutes.selectAll("*").remove(); gMarks.selectAll("*").remove(); markerNodes=[];
  const mapped=list.filter(e=>e.pts);
  mapped.filter(e=>e.route).forEach(e=>{
    const ph=phase(e);
    gRoutes.append("path").attr("class","route"+(ph==="past"?" past":"")+(state.sel===e.id?" sel":"")).attr("d",line(e.route)).attr("stroke",color(e.kind));
    const [ex,ey]=P(e.route[e.route.length-1]);
    endcaps.push(gRoutes.append("rect").attr("class","endcap").attr("data-x",ex).attr("data-y",ey).attr("fill",color(e.kind)).attr("opacity",ph==="past"?.4:1).attr("vector-effect","non-scaling-stroke"));
  });
  const groups=new Map();
  mapped.forEach(e=>e.pts.forEach((pt,i)=>{const key=pt[0].toFixed(3)+","+pt[1].toFixed(3);if(!groups.has(key))groups.set(key,[]);groups.get(key).push({e,pt,i});}));
  groups.forEach(arr=>{
    const n=arr.length;
    arr.sort((a,b)=>(a.e.id===state.sel)-(b.e.id===state.sel));
    arr.forEach((o,j)=>{
      const [x,y]=P(o.pt); const dx=(j-(n-1)/2)*15, dy=0;
      const ph=phase(o.e);
      const node=gMarks.append("g").attr("class",`mk ${o.e.status} ${ph==="past"?"past":""} ${ph==="live"?"live":""} ${state.sel===o.e.id?"sel":""}`)
        .attr("tabindex",0).attr("role","button").attr("aria-label",`${L(o.e.title)}, ${fmtDay(o.e.date)}`);
      node.append("title").text(`${L(o.e.title)}\n${fmtDay(o.e.date)} · ${o.e.ptNames?o.e.ptNames[o.i]:L(o.e.where)}`);
      node.append("circle").attr("class","hit").attr("cy",-13).attr("r",13);
      node.append("circle").attr("class","pulse").attr("cy",-13).attr("r",9).attr("stroke",color(o.e.kind));
      shape(node,o.e.kind).attr("fill",color(o.e.kind));
      node.on("click",ev=>{ev.stopPropagation();select(o.e.id,true);});
      node.on("keydown",ev=>{if(ev.key==="Enter"||ev.key===" "){ev.preventDefault();select(o.e.id,true);}});
      markerNodes.push({node,x,y,dx,dy});
    });
  });
  placeAll();
}

const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function drawList(list){
  const box=document.getElementById("items"); box.innerHTML="";
  document.getElementById("count").textContent=T("shown")(list.length);
  if(!list.length){box.innerHTML=`<div class="empty">${esc(T("empty"))}</div>`;return;}
  const byDay=new Map(); list.forEach(e=>{if(!byDay.has(e.date))byDay.set(e.date,[]);byDay.get(e.date).push(e);});
  byDay.forEach((evs,day)=>{
    const grp=document.createElement("section"); grp.className="daygroup";
    grp.innerHTML=`<div class="dayhead">${esc(fmtDay(day))}${day===TODAY?`<span class="now">${esc(T("today"))}</span>`:""}</div>`;
    evs.forEach(e=>{
      const ph=phase(e), sel=state.sel===e.id;
      const it=document.createElement("div"); it.className=`item ${ph==="past"?"past":""} ${sel?"sel":""}`; it.tabIndex=0; it.id="ev-"+e.id; it.setAttribute("role","button"); it.setAttribute("aria-expanded",sel);
      const range=e.end&&!e.openEnd?` → ${fmtDay(e.end)}`:"";
      const pills=[`<span class="pill ${e.status}">${esc(T(e.status))}</span>`];
      if(ph==="live") pills.push(`<span class="pill confirmed">${esc(T("ongoing"))}</span>`);
      if(e.citywide) pills.push(`<span class="pill offmap">${esc(T("citywide"))}</span>`);
      else if(e.offmap) pills.push(`<span class="pill offmap">${esc(T("notOnMap"))}</span>`);
      it.innerHTML=`<div class="bar">${icon(e.kind,22)}</div><div style="min-width:0">
        <h3>${esc(L(e.title))}</h3>
        <div class="meta"><span class="t">${esc(L(e.time))}${esc(range)}</span><span>${esc(L(e.where))}</span></div>
        <div class="meta">${pills.join("")}<span>${esc(T(e.kind))}</span></div>
        ${sel?`<div class="detail"><p>${esc(L(e.desc))}</p>${e.impact?`<p class="impact"><b>${esc(T("impact"))}</b> ${esc(L(e.impact))}</p>`:""}${e.routeTxt?`<p class="route-txt"><b>${esc(T("route"))}</b> ${esc(L(e.routeTxt))}</p>`:""}<div class="src">${esc(T("sources"))} ${e.src.map(([t,u])=>`<a href="${esc(u)}" target="_blank" rel="noopener">${esc(t)}</a>`).join("")}</div></div>`:""}
      </div>`;
      it.onclick=ev=>{if(ev.target.closest("a"))return; select(sel?null:e.id,false);};
      it.onkeydown=ev=>{if(ev.key==="Enter"||ev.key===" "){ev.preventDefault();select(sel?null:e.id,false);}};
      grp.appendChild(it);
    });
    box.appendChild(grp);
  });
}

function render(){
  WHEN.forEach(k=>document.getElementById("when-"+k).setAttribute("aria-pressed",state.when===k));
  document.getElementById("whensel").value=state.when;
  document.querySelectorAll("#typelist input").forEach(i=>i.checked=state.kinds.has(i.value));
  const n=state.kinds.size;
  document.getElementById("typesum").textContent= n===KIND_KEYS.length? T("all") : n<=2? [...state.kinds].map(k=>T(k)).join(", ") : `${n}/${KIND_KEYS.length}`;
  KIND_KEYS.forEach(k=>document.getElementById("kind-"+k).setAttribute("aria-pressed",state.kinds.has(k)));
  const list=EVENTS.filter(visible).sort((a,b)=>a.date.localeCompare(b.date));
  if(state.when==="past") list.reverse();
  drawMap(list); drawList(list);
}

function select(id,fromMap){
  state.sel=id; render();
  if(id&&fromMap){const el=document.getElementById("ev-"+id); if(el) el.scrollIntoView({block:"nearest",behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"});}
  if(id&&!fromMap){const e=EVENTS.find(x=>x.id===id); if(e&&e.pts) focusOn(e);}
}

/* ---------- zoom ---------- */
const zoom=d3.zoom().scaleExtent([1,14]).on("zoom",ev=>{g.attr("transform",ev.transform);K=ev.transform.k;placeAll();});
let padY=0;
function fitViewBox(){
  const r=svgEl.getBoundingClientRect(); if(!r.width) return;
  const vbH=Math.max(H,W*r.height/r.width); padY=(vbH-H)/2; PPU=r.width/W;
  svg.attr("viewBox",`0 ${-padY} ${W} ${vbH}`);
  zoom.extent([[0,-padY],[W,H+padY]]).translateExtent([[-60,-padY-60],[W+60,H+padY+60]]);
}
fitViewBox();
svg.call(zoom);
svg.on("click",()=>{if(state.sel){state.sel=null;render();}});
function isNarrow(){ return matchMedia("(max-width: 700px)").matches; }
function homeView(){ return isNarrow()? d3.zoomIdentity.translate(W/2,H/2).scale(Math.max(2.1,(H+2*padY)/H*1.02)).translate(-P(PLACES.chatelet)[0],-P(PLACES.chatelet)[1]) : d3.zoomIdentity; }
svg.call(zoom.transform,homeView());
let rz; window.addEventListener("resize",()=>{clearTimeout(rz);rz=setTimeout(()=>{fitViewBox();svg.call(zoom.transform,d3.zoomTransform(svgEl));},150);});
document.getElementById("zin").onclick=()=>svg.transition().duration(250).call(zoom.scaleBy,1.6);
document.getElementById("zout").onclick=()=>svg.transition().duration(250).call(zoom.scaleBy,1/1.6);
document.getElementById("zreset").onclick=()=>svg.transition().duration(300).call(zoom.transform,homeView());
const hint=document.getElementById("hint"); const hideHint=()=>hint.classList.add("gone");
svgEl.addEventListener("pointerdown",hideHint,{once:true}); svgEl.addEventListener("wheel",hideHint,{once:true,passive:true}); setTimeout(hideHint,8000);
function focusOn(e){
  const pts=(e.route||e.pts).map(P); const xs=pts.map(p=>p[0]), ys=pts.map(p=>p[1]);
  const x0=Math.min(...xs),x1=Math.max(...xs),y0=Math.min(...ys),y1=Math.max(...ys);
  const k=Math.max(K,Math.min(isNarrow()?5:4,0.6/Math.max((x1-x0)/W,(y1-y0)/H,0.15)));
  const t=d3.zoomIdentity.translate(W/2,H/2).scale(k).translate(-(x0+x1)/2,-(y0+y1)/2);
  svg.transition().duration(matchMedia("(prefers-reduced-motion: reduce)").matches?0:450).call(zoom.transform,t);
}

const locBtn=document.getElementById("locate"), geoMsg=document.getElementById("geomsg");
function say(k,ms=4500){clearTimeout(msgT); geoMsg.textContent=T(k); geoMsg.classList.add("on"); if(ms) msgT=setTimeout(()=>geoMsg.classList.remove("on"),ms);}
function stopGeo(){ if(geoWatch!==null&&navigator.geolocation) navigator.geolocation.clearWatch(geoWatch); geoWatch=null; locBtn.setAttribute("aria-pressed","false"); }
const inMap=([lon,lat])=>lon>2.21&&lon<2.48&&lat>48.80&&lat<48.915;
locBtn.onclick=()=>{
  if(geoWatch!==null){ stopGeo(); gMe.style("display","none"); meXY=null; geoMsg.classList.remove("on"); return; }
  if(!navigator.geolocation){ say("geoUnavail",8000); return; }
  locBtn.setAttribute("aria-pressed","true"); say("locating",0);
  let first=true;
  geoWatch=navigator.geolocation.watchPosition(pos=>{
    const ll=[pos.coords.longitude,pos.coords.latitude]; meXY=P(ll);
    meAcc.attr("cx",meXY[0]).attr("cy",meXY[1]).attr("r",Math.max(0,pos.coords.accuracy)/111320*S);
    gMe.style("display",null); placeAll();
    if(first){ first=false; geoMsg.classList.remove("on");
      if(inMap(ll)){ const k=Math.max(K,isNarrow()?5:4);
        svg.transition().duration(matchMedia("(prefers-reduced-motion: reduce)").matches?0:500).call(zoom.transform,d3.zoomIdentity.translate(W/2,H/2).scale(k).translate(-meXY[0],-meXY[1])); }
      else say("geoOutside"); }
  },err=>{ stopGeo(); gMe.style("display","none"); meXY=null; say(err.code===1?"geoDenied":"geoUnavail",8000); },
  {enableHighAccuracy:true,maximumAge:10000,timeout:20000});
};

applyLang();
render();
</script>
