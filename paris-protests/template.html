<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Montserrat:wght@400;500;600;700;800&family=Noto+Sans+SC:wght@400;700&display=swap">
<style>
/* Layout: civic band header over a map pane + dated agenda; stacks map-over-list on phones.
   Look: Ville de Paris public charter cues: Montserrat throughout, anthracite blue (C100 M40 J0 N80 ≈ #001F33)
   as the brand colour, white surfaces, flat rectangles. No municipal logo or name: independent project. */
:root {
  --bg: #f4f5f6;
  --paper: #ffffff;
  --land: #eef0f2;
  --land-line: #c8ced5;
  --water: #b3cde3;
  --road-minor: #ffffff;
  --road-main: #ffffff;
  --road-motor: #f7d9a8;
  --road-case: #c9d0d8;
  --stn: #ffffff;
  --ink: #001f33;
  --muted: #4b5a68;
  --rule: #dde1e5;
  --enamel: #001f33;
  --enamel-ink: #ffffff;
  --band-sub: #9fb6c9;
  --link: #001f33;
  --k-march: #0b63c5;
  --k-rally: #c26a00;
  --k-strike: #c4245b;
  --k-blockade: #00806a;
  --k-disruption: #6a4fa3;
  --halo: #ffffff;
  --font-display: "Montserrat", "Helvetica Neue", Arial, "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
  --font-body: "Montserrat", "Helvetica Neue", Arial, "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
  --font-mono: "Montserrat", "Helvetica Neue", Arial, "Noto Sans SC", "PingFang SC", "Microsoft YaHei", sans-serif;
  --font-plaque: "Barlow Condensed", "Arial Narrow", "Noto Sans SC", "PingFang SC", sans-serif;
  --plaque: #1f3f78;
  --plaque-frame: #1d4a34;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #07131d; --road-minor: #24384b; --road-main: #2c4459; --road-motor: #5b4a2c; --road-case: #0a1a27; --stn: #0e1e2b; --paper: #0e1e2b; --land: #142636; --land-line: #2b4054; --water: #1f4060;
    --ink: #e8eef3; --muted: #9fb0bf; --rule: #22374a; --enamel: #001f33; --enamel-ink: #ffffff; --band-sub: #9fb6c9; --link: #8cc4f5;
    --k-march: #6aa8f5; --k-rally: #f0a540; --k-strike: #f06d97; --k-blockade: #3cc4a8; --k-disruption: #b49be8; --halo: #0e1e2b;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #07131d; --road-minor: #24384b; --road-main: #2c4459; --road-motor: #5b4a2c; --road-case: #0a1a27; --stn: #0e1e2b; --paper: #0e1e2b; --land: #142636; --land-line: #2b4054; --water: #1f4060;
  --ink: #e8eef3; --muted: #9fb0bf; --rule: #22374a; --enamel: #001f33; --enamel-ink: #ffffff; --band-sub: #9fb6c9; --link: #8cc4f5;
  --k-march: #6aa8f5; --k-rally: #f0a540; --k-strike: #f06d97; --k-blockade: #3cc4a8; --k-disruption: #b49be8; --halo: #0e1e2b;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 14px; line-height: 1.5; }
.wrap { max-width: 1400px; margin: 0 auto; padding-inline: 16px; padding-block: 16px 32px; display: grid; gap: 14px; }

.band { background: var(--enamel); color: var(--enamel-ink); padding-inline: 16px; padding-block: 14px 16px; border-bottom: 4px solid var(--k-march); }
.band-in { max-width: 1400px; margin: 0 auto; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 10px 16px; }
/* Title as a Paris street-name plaque: enamel blue, thin white inner rule, dark green cast frame. */
.sign { display: inline-grid; justify-items: center; gap: 1px; min-width: 0; max-width: 100%;
  background: var(--plaque); color: #ffffff; padding: 5px 18px 7px;
  border: 4px solid var(--plaque-frame); border-radius: 7px;
  box-shadow: inset 0 0 0 2px var(--plaque), inset 0 0 0 4px #ffffff, 0 2px 0 rgba(0,0,0,.35); }
.sign small { font: 600 13px/1.1 var(--font-plaque); letter-spacing: .1em; text-transform: uppercase; opacity: .92; text-align: center; }
.sign small::after { content: ""; display: block; width: 60%; height: 1px; background: rgba(255,255,255,.7); margin: 3px auto 1px; }
.sign h1 { margin: 0; font: 700 clamp(28px, 4.6vw, 44px)/1 var(--font-plaque); letter-spacing: .015em; text-align: center; text-wrap: balance; }
.lang { position: relative; display: inline-flex; align-items: center; gap: 6px; border: 1.5px solid rgba(255,255,255,.6); border-radius: 4px; padding-inline: 10px 6px; color: #ffffff; }
.lang select { font: 700 13px var(--font-body); color: #ffffff; background: transparent; border: 0; padding: 8px 22px 8px 2px; appearance: none; -webkit-appearance: none; cursor: pointer;
  background-image: linear-gradient(45deg, transparent 50%, #ffffff 50%), linear-gradient(135deg, #ffffff 50%, transparent 50%);
  background-position: calc(100% - 9px) 52%, calc(100% - 4px) 52%; background-size: 5px 5px; background-repeat: no-repeat; }
.lang select option { color: #001f33; background: #ffffff; }
.lang:focus-within { outline: 2px solid #ffffff; outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
header.top { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px 24px; }
.lede { margin: 0; max-width: 70ch; color: var(--muted); font-size: 14.5px; line-height: 1.6; }
.lede b { color: var(--ink); font-weight: 600; }

.controls { display: flex; flex-wrap: wrap; gap: 8px 18px; align-items: center; }
.group { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.group > span { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); margin-right: 2px; }
.chip { font: 600 13px var(--font-body); border: 1.5px solid var(--ink); background: var(--paper); color: var(--ink); border-radius: 4px; padding: 5px 12px; cursor: pointer; display: inline-flex; gap: 6px; align-items: center; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.chip:hover { box-shadow: inset 0 -3px 0 var(--k-march); }
.chip:focus-visible, .ctl:focus-visible, .item:focus-visible { outline: 2px solid var(--k-march); outline-offset: 2px; }
.sw { width: 10px; height: 10px; display: inline-block; flex: none; }
.sw.march { background: var(--k-march); border-radius: 50%; }
.sw.rally { background: var(--k-rally); border-radius: 50%; }
.sw.strike { background: var(--k-strike); }
.sw.blockade { background: var(--k-blockade); transform: rotate(45deg) scale(.85); }
.sw.disruption { background: var(--k-disruption); clip-path: polygon(50% 0, 100% 100%, 0 100%); }

.main { display: grid; grid-template-columns: minmax(0, 1fr) 400px; gap: 14px; align-items: start; }
@media (max-width: 900px) { .main { grid-template-columns: minmax(0, 1fr); } }

.mapbox { position: relative; background: var(--paper); border: 1px solid var(--rule); border-radius: 0; overflow: hidden; min-width: 0; }
@media (min-width: 901px) { .mapbox { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 12px); } }
#map { display: block; width: 100%; height: auto; aspect-ratio: 1000 / 610; max-width: 100%; touch-action: none; cursor: grab; -webkit-user-select: none; user-select: none; }
.mfilters { display: none; }
@media (max-width: 700px) {
  /* Phone layout: filters as two drop-downs, then a near-full-screen map, then intro, agenda, footer. */
  header.top, .main { display: contents; }
  .controls { order: 1; width: 100%; }
  .mapbox { order: 2; margin-inline: -16px; border-inline: 0; }
  .lede { order: 3; }
  aside.list { order: 4; }
  footer.note { order: 5; }
  .controls .group { display: none; }
  .mfilters { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; width: 100%; }
  #map { aspect-ratio: auto; height: calc(100vh - 128px); height: calc(100svh - 128px); min-height: 440px; }
  .band { padding-block: 10px 12px; }
  .band-in { flex-wrap: nowrap; gap: 10px; }
  .sign { padding: 4px 12px 6px; min-width: 0; flex: 0 1 auto; }
  .sign h1 { font-size: min(27px, 6vw); white-space: nowrap; }
  .sign small { font-size: 9.5px; line-height: 1.45; letter-spacing: .06em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
  .lang { flex: none; padding-inline: 8px 2px; }
  .lang svg { display: none; }
  .lang select { font-size: 12.5px; padding-right: 20px; }
}
@media (max-width: 360px) {
  .band-in { flex-wrap: wrap; }
  .sign h1 { font-size: 24px; }
}
.mctl { position: relative; display: grid; gap: 2px; min-width: 0; border: 1.5px solid var(--ink); border-radius: 4px; background: var(--paper); padding: 5px 10px 6px; }
.mlab { font-size: 10px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); }
.mctl select { font: 700 14px var(--font-body); color: var(--ink); background: transparent; border: 0; padding: 0 18px 0 0; appearance: none; -webkit-appearance: none; width: 100%; min-width: 0; text-overflow: ellipsis;
  background-image: linear-gradient(45deg, transparent 50%, currentColor 50%), linear-gradient(135deg, currentColor 50%, transparent 50%);
  background-position: calc(100% - 7px) 55%, calc(100% - 2px) 55%; background-size: 5px 5px; background-repeat: no-repeat; }
.mctl:focus-within { outline: 2px solid var(--k-march); outline-offset: 1px; }
.mtype summary { list-style: none; display: grid; gap: 2px; cursor: pointer; }
.mtype summary::-webkit-details-marker { display: none; }
#typesum { font-weight: 700; font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; padding-right: 18px;
  background-image: linear-gradient(45deg, transparent 50%, currentColor 50%), linear-gradient(135deg, currentColor 50%, transparent 50%);
  background-position: calc(100% - 7px) 55%, calc(100% - 2px) 55%; background-size: 5px 5px; background-repeat: no-repeat; }
.mtype-list { position: absolute; z-index: 20; right: -1.5px; top: calc(100% + 4px); min-width: 100%; width: max-content; max-width: calc(100vw - 32px); background: var(--paper); border: 1.5px solid var(--ink); border-radius: 4px; padding: 6px; display: grid; gap: 2px; box-shadow: 0 6px 18px rgba(0,0,0,.18); }
.mtype-list label { display: flex; align-items: center; gap: 10px; padding: 9px 8px; font-weight: 600; font-size: 14px; cursor: pointer; border-radius: 3px; }
.mtype-list label:hover { background: color-mix(in srgb, var(--ink) 6%, transparent); }
.mtype-list input { width: 18px; height: 18px; accent-color: var(--ink); margin: 0; }
.hint { position: absolute; left: 10px; top: 10px; right: 56px; width: fit-content; background: color-mix(in srgb, var(--paper) 92%, transparent); border: 1px solid var(--rule); font-size: 11.5px; font-weight: 600; padding: 4px 8px; pointer-events: none; transition: opacity .4s; }
.hint.gone { opacity: 0; }
.ctl[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.road { fill: none; stroke-linecap: round; stroke-linejoin: round; vector-effect: non-scaling-stroke; }
.road.case { stroke: var(--road-case); }
.road.r2 { stroke: var(--road-minor); }
.road.r1 { stroke: var(--road-main); }
.road.r0 { stroke: var(--road-motor); }
#map:not(.z-lm) .lm2 { display: none; }
#map:active { cursor: grabbing; }
.zoom { position: absolute; right: 10px; top: 10px; display: flex; flex-direction: column; gap: 4px; }
.ctl { width: 34px; height: 34px; border-radius: 4px; border: 1px solid var(--rule); background: var(--paper); color: var(--ink); font: 600 16px/1 var(--font-body); cursor: pointer; }
.legend { position: absolute; left: 10px; bottom: 10px; background: color-mix(in srgb, var(--paper) 92%, transparent); border: 1px solid var(--rule); border-radius: 2px; padding: 6px 9px; font-size: 11.5px; display: grid; grid-template-columns: auto auto; gap: 2px 14px; }
.legend div { display: flex; gap: 6px; align-items: center; }
.ring { width: 11px; height: 11px; border-radius: 50%; border: 1.5px dashed var(--muted); display: inline-block; }
@media (max-width: 520px) { .legend { display: none; } }

.arr { fill: var(--land); stroke: var(--land-line); stroke-width: 1; vector-effect: non-scaling-stroke; }
.seine { fill: none; stroke: var(--water); stroke-linecap: round; stroke-linejoin: round; }
.lm2 text { font-weight: 500; font-style: italic; }
.arrnum { font: 700 14px var(--font-display); fill: var(--muted); opacity: .55; text-anchor: middle; dominant-baseline: middle; pointer-events: none; }
.lm { font: 600 10.5px var(--font-body); fill: var(--ink); paint-order: stroke; stroke: var(--halo); stroke-width: 3px; pointer-events: none; }
.lmdot { fill: var(--ink); }
.route { fill: none; stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; vector-effect: non-scaling-stroke; opacity: .85; }
.route.sel { stroke-width: 6.5; opacity: 1; }
.route.past { opacity: .35; stroke-dasharray: 2 5; }
.mk { cursor: pointer; }
.mk .hit { fill: transparent; }
.mk .shape { stroke: var(--halo); stroke-width: 2; }
.mk.unconfirmed .shape { stroke: var(--ink); stroke-dasharray: 3 2; stroke-width: 1.5; }
.mk.past { opacity: .4; }
.mk.sel .shape { stroke: var(--ink); stroke-width: 3; }
.mk .pulse { fill: none; stroke-width: 2; opacity: 0; }
.mk.live .pulse { animation: pulse 2s ease-out infinite; }
@keyframes pulse { 0% { opacity: .8; transform: scale(.6); } 100% { opacity: 0; transform: scale(1.8); } }
@media (prefers-reduced-motion: reduce) { .mk.live .pulse { animation: none; opacity: .5; } }
.endcap { stroke: var(--halo); stroke-width: 1.5; }

aside.list { background: var(--paper); border: 1px solid var(--rule); border-top: 4px solid var(--ink); min-width: 0; }
.list h2 { margin: 0; padding: 12px 14px 10px; font: 800 18px var(--font-display); letter-spacing: .06em; text-transform: uppercase; border-bottom: 1px solid var(--rule); display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.list h2 span { font: 600 12px var(--font-body); font-variant-numeric: tabular-nums; color: var(--muted); text-transform: none; letter-spacing: 0; }
.daygroup { border-bottom: 1px solid var(--rule); }
.daygroup:last-child { border-bottom: 0; }
.dayhead { padding: 10px 14px 2px; font: 700 11.5px var(--font-body); color: var(--ink); text-transform: uppercase; letter-spacing: .08em; font-variant-numeric: tabular-nums; display: flex; gap: 8px; align-items: center; }
.dayhead .now { font-weight: 700; letter-spacing: .06em; background: var(--k-march); color: #ffffff; border-radius: 2px; padding: 1px 6px; }
.item { display: grid; grid-template-columns: 6px minmax(0,1fr); gap: 11px; padding: 9px 14px 11px; cursor: pointer; }
.item:hover { background: color-mix(in srgb, var(--ink) 4%, transparent); }
.item.sel { background: color-mix(in srgb, var(--k-march) 10%, transparent); box-shadow: inset 3px 0 0 var(--ink); }
.item .bar { border-radius: 3px; }
.item.past { opacity: .62; }
.item h3 { margin: 0; font-size: 14.5px; font-weight: 700; line-height: 1.3; text-wrap: balance; }
.meta { display: flex; flex-wrap: wrap; gap: 4px 10px; margin-top: 3px; color: var(--muted); font-size: 12.5px; }
.meta .t { font-weight: 600; font-size: 12.5px; color: var(--ink); font-variant-numeric: tabular-nums; }
.pill { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; border-radius: 2px; padding: 0 5px; border: 1px solid currentColor; }
.pill.confirmed { color: var(--k-blockade); }
.pill.announced { color: var(--k-rally); }
.pill.unconfirmed { color: var(--k-strike); border-style: dashed; }
.pill.offmap { color: var(--muted); }
.detail { margin-top: 7px; display: grid; gap: 6px; font-size: 13px; }
.detail p { margin: 0; max-width: 60ch; }
.detail .route-txt { font-size: 12.5px; color: var(--muted); }
.detail .impact { font-size: 12.5px; }
.detail .src { font-size: 12px; display: flex; flex-wrap: wrap; gap: 4px 10px; }
.detail .src a { color: var(--link); text-underline-offset: 2px; }
.empty { padding: 18px 14px; color: var(--muted); }

footer.note { color: var(--muted); font-size: 12.5px; border-top: 1px solid var(--rule); padding-top: 12px; display: grid; gap: 4px; max-width: 95ch; }
footer.note p { margin: 0; }
</style>

        fr:"Huit syndicats de sapeurs-pompiers professionnels y ont lancé une « colonne de renfort de la colère » pour réclamer des effectifs et des moyens. Leur préavis national court du 8 septembre au 20 octobre, jour du vote de la première partie du budget 2027, et ils refusent de le lever sans avancées. Environ 2 682 pompiers par jour (9,3 %) sont en grève.",zh:"八个职业消防员工会在此设立“愤怒增援纵队”，要求增加人手和资源。全国罢工预告期为9月8日至10月20日（当天将表决2027年预算第一部分），工会表示没有结果不会撤回。每天约有2,682名消防员（9.3%）参加罢工。",pt:"Oito sindicatos de bombeiros profissionais montaram aqui uma \"coluna de reforço da raiva\" para exigir mais pessoal e meios. O pré-aviso de greve nacional vai de 8 set. a 20 out., dia da votação da primeira parte do orçamento de 2027, e dizem que não o levantam sem resultados. Cerca de 2.682 bombeiros por dia (9,3%) estiveram em greve.",de:"Acht Gewerkschaften der Berufsfeuerwehr haben hier eine „Verstärkungskolonne der Wut“ aufgebaut und fordern mehr Personal und Mittel. Ihre landesweite Streikankündigung gilt vom 8. Sept. bis 20. Okt., dem Tag der Abstimmung über den ersten Teil des Haushalts 2027; ohne Ergebnisse wollen sie sie nicht zurückziehen. Rund 2.682 Feuerwehrleute pro Tag (9,3 %) streiken."},

  desc:{en:"CGT-RATP covers all RATP staff with an unlimited notice, demanding a fuel allowance and wages indexed to inflation. A notice lets staff walk out on any day; it doesn't mean the network stops every day. Traffic was near normal on the metro on 29 Sept. Check RATP traffic info each morning.",

  desc:{fr:"Blocages menés par les lycéens contre le manque de profs, les classes surchargées, les emplois du temps trop lourds et la pression de Parcoursup. Le 1er octobre, environ 640 lycées étaient bloqués en France, dont au moins 16 à Paris. Pour le vendredi 2 octobre, le préfet de police a interdit les rassemblements aux abords de 13 lycées parisiens fermés (liste dans l'arrêté). Les marqueurs indiquent les établissements cités dans la presse, pas une liste complète.",en:"Student-led blockades over teacher shortages, class sizes, heavy timetables and Parcoursup pressure. About 640 lycées were blocked nationwide on 1 Oct, at least 16 of them in Paris. For Fri 2 Oct the police prefect banned gatherings outside 13 closed Paris lycées (listed in the decree). Markers show schools named in reports, not a complete list.",es:"Bloqueos organizados por alumnos contra la falta de profesorado, las clases masificadas, los horarios cargados y la presión de Parcoursup. El 1 de octubre había unos 640 institutos bloqueados en Francia, al menos 16 en París. Para el viernes 2 de octubre, el prefecto de policía prohibió las concentraciones junto a 13 institutos parisinos cerrados (lista en el decreto). Los marcadores señalan los centros citados en la prensa, no la lista completa.",zh:"学生发起的封锁，抗议教师短缺、班级人数过多、课时过重和 Parcoursup 升学压力。10月1日全国约有640所高中被封锁，其中巴黎至少16所。10月2日（周五），巴黎警察局长禁止在13所已关闭的巴黎高中周边聚集（名单见法令）。地图标记仅为报道中提到的学校，并非完整名单。",pt:"Bloqueios organizados por alunos contra a falta de professores, turmas sobrelotadas, horários pesados e a pressão do Parcoursup. A 1 out. havia cerca de 640 liceus bloqueados no país, pelo menos 16 em Paris. Para sexta, 2 out., o prefeito de polícia proibiu concentrações junto a 13 liceus parisienses fechados (lista no decreto). Os marcadores mostram as escolas citadas na imprensa, não uma lista completa.",de:"Von Schülern organisierte Blockaden gegen Lehrermangel, überfüllte Klassen, volle Stundenpläne und den Druck von Parcoursup. Am 1. Okt. waren landesweit rund 640 Gymnasien blockiert, mindestens 16 davon in Paris. Für Fr. 2. Okt. hat der Polizeipräfekt Versammlungen vor 13 geschlossenen Pariser Gymnasien verboten (Liste im Erlass). Die Markierungen zeigen in Berichten genannte Schulen, keine vollständige Liste."},
  src:[["franceinfo", "https://www.franceinfo.fr/societe/education/scolarite/guide-parents/lycee/direct-blocage-des-lycees-les-eleves-et-les-etudiants-appeles-a-un-acte-deux-de-la-mobilisation-malgre-les-violences_8217775.html"], ["CNews", "https://www.cnews.fr/france/2026-10-01/blocus-des-lycees-les-prefets-interdisent-les-manifestations-autour-des"], ["France 3 Paris IDF", "https://france3-regions.franceinfo.fr/paris-ile-de-france/paris/acte-deux-de-la-mobilisation-des-lyceens-le-point-sur-les-blocages-et-les-rassemblements-en-ile-de-france-3426024.html"], ["VousNousIls", "https://www.vousnousils.fr/2026/09/30/blocage-des-lycees-les-syndicats-demandent-la-fin-des-violences-lusl-appelle-a-nouvelles-actions-le-1er-octobre-705175"]]},

  desc:{en:"Rally and street performance against the Argentine president's \"Argentina Week\" investor forum in Paris (30 Sept – 2 Oct). Attac also published a statement saying Milei \"is not welcome in Paris\", citing cuts to public services, restrictions on protest and his revisionism about the 1976–83 dictatorship.",
        es:"Concentración y performance contra la \"Argentina Week\", el foro de inversores del presidente argentino en París (30 sept. – 2 oct.). Attac también publicó un comunicado afirmando que Milei \"no es bienvenido en París\", por los recortes en servicios públicos, las restricciones al derecho de protesta y su revisionismo sobre la dictadura de 1976-83.",
        fr:"Rassemblement et performance contre l'« Argentina Week », le forum d'investisseurs du président argentin à Paris (30 sept. – 2 oct.). Attac a aussi publié un communiqué « Javier Milei n'est pas le bienvenu à Paris », dénonçant la destruction des services publics, les atteintes au droit de manifester et son révisionnisme sur la dictature de 1976-83.",zh:"集会和街头表演，反对阿根廷总统在巴黎举办的“Argentina Week”投资论坛（9月30日至10月2日）。Attac 也发表声明称米莱“在巴黎不受欢迎”，指出其削减公共服务、限制抗议权利以及对1976–83年独裁时期的修正主义。",pt:"Concentração e performance contra a \"Argentina Week\", o fórum de investidores do presidente argentino em Paris (30 set. – 2 out.). A Attac também publicou um comunicado dizendo que Milei \"não é bem-vindo em Paris\", apontando cortes nos serviços públicos, restrições ao direito de manifestação e o seu revisionismo sobre a ditadura de 1976-83.",de:"Kundgebung und Straßenperformance gegen das Investorenforum „Argentina Week“ des argentinischen Präsidenten in Paris (30. Sept. – 2. Okt.). Auch Attac erklärte, Milei sei „in Paris nicht willkommen“, und verwies auf Kürzungen öffentlicher Dienste, Einschränkungen des Demonstrationsrechts und seinen Revisionismus zur Diktatur 1976–83."},
  src:[["Paris-luttes.info","https://paris-luttes.info/petons-la-facho-week-21206?lang=fr"],["Attac France","https://france.attac.org/actus-et-medias/salle-de-presse/article/javier-milei-n-est-pas-le-bienvenu-a-paris"],["CNews (visit)","https://www.cnews.fr/france/2026-10-01/visite-de-javier-milei-emmanuel-macron-recoit-le-president-argentin-ce-jeudi-pour"]]},

  desc:{fr:"La Marche de l'Inter-LGBT, annulée le 27 juin pour cause de canicule et reprogrammée, avec un parcours raccourci. Selon l'AFP, des dizaines de milliers de personnes ont défilé, inquiètes de la montée de l'extrême droite ; un concert a suivi place de la Bastille.",en:"Inter-LGBT's Pride, cancelled on 27 June for the heatwave and rescheduled on a shortened route. According to AFP, tens of thousands marched, worried about the rise of the far right; a concert followed at Place de la Bastille.",es:"El Orgullo de la Inter-LGBT, cancelado el 27 de junio por la ola de calor y reprogramado con un recorrido acortado. Según la AFP, decenas de miles de personas marcharon, preocupadas por el auge de la extrema derecha; después hubo un concierto en la Place de la Bastille.",zh:"Inter-LGBT 主办的骄傲游行，原定6月27日因热浪取消，改期后路线缩短。据法新社报道，数万人参加游行，担忧极右翼势力上升；之后在巴士底广场举行了音乐会。",pt:"A Marcha do Orgulho da Inter-LGBT, cancelada a 27 de junho por causa da onda de calor e reagendada com percurso encurtado. Segundo a AFP, dezenas de milhares de pessoas desfilaram, preocupadas com a subida da extrema-direita; seguiu-se um concerto na Place de la Bastille.",de:"Die Pride der Inter-LGBT, am 27. Juni wegen der Hitzewelle abgesagt und auf verkürzter Route nachgeholt. Laut AFP zogen Zehntausende durch Paris, besorgt über den Aufstieg der extremen Rechten; danach gab es ein Konzert auf der Place de la Bastille."},

 {id:"jeunesse",date:"2026-10-06",kind:"march",status:"announced",pts:[PLACES.republique],
  time:{fr:"14h (déclarée) ; AG étudiante à 17h",en:"14:00 (declared); student assembly at 17:00",es:"14:00 (declarada); asamblea estudiantil a las 17:00",zh:"14:00（已申报）；17:00 学生大会",pt:"14:00 (declarada); assembleia estudantil às 17:00",de:"14:00 (angemeldet); Studierendenversammlung um 17:00"},
  title:{en:"National youth demonstration",es:"Manifestación nacional de la juventud",fr:"Manifestation nationale de la jeunesse",zh:"全国青年游行",pt:"Manifestação nacional da juventude",de:"Landesweite Jugenddemo"},
  where:{fr:"Place de la République (départ déclaré) – parcours pas encore publié",en:"Place de la République (declared start) – route not yet published",es:"Place de la République (salida declarada) – recorrido aún sin publicar",zh:"Place de la République（申报的出发地点）– 路线尚未公布",pt:"Place de la République (partida declarada) – percurso ainda não publicado",de:"Place de la République (angemeldeter Start) – Route noch nicht veröffentlicht"},
  desc:{fr:"L'Union étudiante et l'Union syndicale lycéenne appellent à une « grande manifestation nationale » des lycéens et étudiants, dans la foulée des blocages. À Paris, une demande de manifestation a été déposée pour 14h place de la République. L'intersyndicale de l'Éducation nationale (FSU, CGT, FO, CFDT, Unsa, SUD, Solidaires) appelle à y participer, y compris par la grève ; la CGT, FO et Solidaires de Paris appellent aussi à protéger les lycéens devant les établissements bloqués.",en:"The Union étudiante and the Union syndicale lycéenne call a \"grande manifestation nationale\" of school and university students, following the blockades. In Paris, a march has been declared for 14:00 at Place de la République. The national-education unions (FSU, CGT, FO, CFDT, Unsa, SUD, Solidaires) call staff to join, including by striking; the Paris CGT, FO and Solidaires also call members to protect students outside blockaded schools.",es:"La Union étudiante y la Union syndicale lycéenne convocan una \"gran manifestación nacional\" de estudiantes de instituto y universidad, tras los bloqueos. En París se ha declarado una manifestación a las 14:00 en la Place de la République. Los sindicatos de educación (FSU, CGT, FO, CFDT, Unsa, SUD, Solidaires) llaman al personal a sumarse, también con huelga; la CGT, FO y Solidaires de París piden además proteger a los alumnos ante los institutos bloqueados.",zh:"继封锁行动之后，Union étudiante 和 Union syndicale lycéenne 号召中学生和大学生举行“全国大游行”。巴黎的游行已申报，14:00 在共和国广场出发。国民教育系统各工会（FSU、CGT、FO、CFDT、Unsa、SUD、Solidaires）号召教职员工参加，包括罢工；巴黎的 CGT、FO 和 Solidaires 还号召成员到被封锁的学校门前保护学生。",pt:"Na sequência dos bloqueios, a Union étudiante e a Union syndicale lycéenne convocam uma \"grande manifestação nacional\" de alunos do secundário e estudantes universitários. Em Paris foi declarada uma manifestação às 14:00 na Place de la République. Os sindicatos da educação (FSU, CGT, FO, CFDT, Unsa, SUD, Solidaires) apelam ao pessoal para participar, incluindo com greve; a CGT, FO e Solidaires de Paris apelam também a proteger os alunos junto aos liceus bloqueados.",de:"Nach den Blockaden rufen Union étudiante und Union syndicale lycéenne Schüler und Studierende zu einer „großen landesweiten Demonstration“ auf. In Paris ist eine Demo für 14:00 an der Place de la République angemeldet. Die Bildungsgewerkschaften (FSU, CGT, FO, CFDT, Unsa, SUD, Solidaires) rufen das Personal zur Teilnahme auf, auch per Streik; CGT, FO und Solidaires Paris rufen zudem dazu auf, Schüler vor blockierten Schulen zu schützen."},
  src:[["CGT Paris", "https://www.cgtparis.fr/2026/10/03/appel-intersyndical-a-manifester-le-6-octobre-pour-les-revendications-portees-par-les-lyceen%C2%B7es/"], ["CNews", "https://www.cnews.fr/france/2026-10-02/blocus-des-lycees-faute-de-mesures-concretes-les-organisations-lyceennes-et"], ["ICI", "https://www.ici.fr/infos/economie-social/lycees-une-intersyndicale-de-l-education-nationale-appelle-a-la-mobilisation-mardi-y-compris-par-la-greve-7530417"], ["Union étudiante", "https://union-etudiante.fr/communique-de-presse/appel-de-lusl-et-ue-a-bloquer-les-lycees-et-facs-ce-jeudi-1er-octobre-et-a-une-grande-manifestation-de-la-jeunesse-le-6-octobre/"], ["CGT", "https://www.cgt.fr/actualites/france/mobilisation/le-6-octobre-la-cgt-sera-aux-cotes-des-lyceennes-et-etudiantes"],["Info libertaire","https://www.infolibertaire.net/mobilisation-lyceenne-infos-pour-la-semaine-du-5-octobre"],["Sortiraparis – stations fermées","https://www.sortiraparis.com/en/news/in-paris/articles/353261-student-and-high-school-student-protests-on-october-6-paris-metro-stations-closed"]],
  impact:{fr:"Métro 5 : stations Oberkampf et Richard-Lenoir fermées pendant la manifestation. Assemblée générale étudiante prévue à 17h. La veille (lun. 5 oct., 15h), assemblée des personnels, élèves et parents à la Bourse du Travail.",en:"Metro line 5: Oberkampf and Richard-Lenoir stations closed during the march. A student general assembly was planned at 17:00. The day before (Mon 5 Oct, 15:00), a meeting of staff, pupils and parents at the Bourse du Travail.",es:"Metro 5: estaciones Oberkampf y Richard-Lenoir cerradas durante la manifestación. Asamblea general estudiantil prevista a las 17:00. La víspera (lun. 5 oct., 15:00), asamblea de personal, alumnos y padres en la Bourse du Travail.",zh:"地铁5号线：游行期间 Oberkampf 和 Richard-Lenoir 站关闭。17:00 计划举行学生全体大会。前一天（10月5日周一15:00）在 Bourse du Travail 举行教职员工、学生和家长大会。",pt:"Metro 5: estações Oberkampf e Richard-Lenoir fechadas durante a manifestação. Assembleia geral estudantil prevista às 17:00. Na véspera (seg. 5 out., 15:00), assembleia de pessoal, alunos e pais na Bourse du Travail.",de:"Metro 5: Stationen Oberkampf und Richard-Lenoir während der Demo geschlossen. Für 17:00 war eine Vollversammlung der Studierenden geplant. Am Vortag (Mo. 5. Okt., 15:00) Versammlung von Personal, Schülern und Eltern in der Bourse du Travail."}},

 {id:"omnibus",date:"2026-10-10",kind:"rally",status:"announced",pts:[PLACES.europe],
  time:{en:"11:00",es:"11:00",fr:"11h",zh:"11:00",pt:"11:00",de:"11:00"},
  title:{en:"Pots-and-pans rally against the EU \"Omnibus\" pesticides law",es:"Cacerolada contra la ley europea \"Omnibus\" de pesticidas",fr:"Rassemblement-casseroles contre l'Omnibus pesticides",zh:"反对欧盟“Omnibus”农药法的敲锅集会",pt:"Panelaço contra a lei europeia \"Omnibus\" dos pesticidas",de:"Topfschlag-Kundgebung gegen das EU-„Omnibus“-Pestizidgesetz"},
  where:{en:"Place de l'Europe – Simone Veil (8e)",es:"Place de l'Europe – Simone Veil (8.º)",fr:"Place de l'Europe – Simone Veil (8e)",zh:"Place de l'Europe – Simone Veil（第8区）",pt:"Place de l'Europe – Simone Veil (8.º)",de:"Place de l'Europe – Simone Veil (8.)"},
  desc:{en:"Part of a national weekend of loud rallies (10–11 Oct) before the European Parliament vote on the Omnibus text, which would extend pesticide approvals and loosen controls. Called by France Nature Environnement, Générations Futures, Greenpeace, unions and about a hundred other groups. Bring a pot to bang at the time of the vote.",
        es:"Forma parte de un fin de semana nacional de concentraciones ruidosas (10-11 oct.) antes de la votación en el Parlamento Europeo del texto Omnibus, que alargaría las autorizaciones de pesticidas y relajaría los controles. Convocan France Nature Environnement, Générations Futures, Greenpeace, sindicatos y un centenar de organizaciones. Lleva una cacerola para la hora de la votación.",
        fr:"Dans le cadre d'un week-end national de rassemblements bruyants (10-11 oct.) avant le vote du Parlement européen sur l'Omnibus, qui prolongerait les autorisations de pesticides et allégerait les contrôles. À l'appel de France Nature Environnement, Générations Futures, Greenpeace, de syndicats et d'une centaine d'organisations. Casseroles bienvenues au moment du vote.",zh:"属于全国“喧闹集会”周末（10月10–11日）的一部分，赶在欧洲议会表决 Omnibus 文本之前；该文本将延长农药许可并放松管控。由 France Nature Environnement、Générations Futures、绿色和平、工会及约一百个组织发起。表决时请带锅来敲。",pt:"Faz parte de um fim de semana nacional de concentrações ruidosas (10-11 out.) antes da votação no Parlamento Europeu do texto Omnibus, que prolongaria as autorizações de pesticidas e aliviaria os controlos. Convocada pela France Nature Environnement, Générations Futures, Greenpeace, sindicatos e cerca de cem organizações. Traga um tacho para bater na hora da votação.",de:"Teil eines landesweiten Wochenendes lauter Kundgebungen (10.–11. Okt.) vor der Abstimmung im Europäischen Parlament über den Omnibus-Text, der Pestizidzulassungen verlängern und Kontrollen lockern würde. Aufgerufen von France Nature Environnement, Générations Futures, Greenpeace, Gewerkschaften und rund hundert Organisationen. Zur Abstimmung einen Topf zum Schlagen mitbringen."},
  src:[["Démosphère Paris","https://paris.demosphere.net/"],["Générations Futures","https://www.generations-futures.fr/actualites/mobilisations-pesticides/"],["FNE","https://fne.asso.fr/agenda/mobilisations-pour-dire-non-a-l-omnibus-pesticides"],["Solidaires","https://www.solidaires.org/contre-lomnibus-pesticides-les-10-et-11-octobre/"]]},

 {id:"gj17",date:"2026-10-17",kind:"rally",status:"unconfirmed",pts:[PLACES.republique,PLACES.bastille],ptNames:["Place de la République","Place de la Bastille"],
  time:{en:"Time TBA",es:"Hora por confirmar",fr:"Horaire à venir",zh:"时间待定",pt:"Hora a confirmar",de:"Uhrzeit folgt"},
  title:{en:"\"Gilets jaunes\" call against fuel prices",es:"Convocatoria de \"chalecos amarillos\" contra el precio del carburante",fr:"Appel « Gilets jaunes » contre le prix des carburants",zh:"“黄背心”反对油价号召",pt:"Apelo dos \"coletes amarelos\" contra o preço dos combustíveis",de:"„Gelbwesten“-Aufruf gegen Spritpreise"},
  where:{en:"République, or Bastille depending on route",es:"République, o Bastille según el recorrido",fr:"République, ou Bastille selon le parcours",zh:"République，或视路线定在 Bastille",pt:"République, ou Bastille conforme o percurso",de:"République oder je nach Route Bastille"},
  desc:{fr:"Appel viral sur TikTok pour bloquer les prix à la pompe, taxer les superprofits pétroliers et instaurer le RIC. Aucun organisateur identifié et, selon les services de police, aucune déclaration déposée en préfecture ; des figures du mouvement d'origine déconseillent de venir à Paris. Des actions dans des dépôts et raffineries sont aussi évoquées.",en:"Viral TikTok call to freeze pump prices, tax oil superprofits and bring in citizens' referendums. No identified organizer and, according to the police, no declaration filed with the prefecture; some figures of the original movement tell people not to come to Paris. Actions at fuel depots and refineries are also mentioned.",es:"Llamamiento viral en TikTok para congelar el precio de los surtidores, gravar los superbeneficios petroleros e instaurar referendos de iniciativa ciudadana. Sin organizador identificado y, según la policía, sin declaración presentada en la prefectura; algunas figuras del movimiento original desaconsejan ir a París. También se mencionan acciones en depósitos y refinerías.",zh:"TikTok 上的病毒式号召：冻结油价、对石油超额利润征税、引入公民倡议公投。没有明确的组织者，据警方称也未向警察局申报；原运动的部分人物劝大家不要来巴黎。也有人提到在油库和炼油厂的行动。",pt:"Apelo viral no TikTok para congelar o preço nas bombas, taxar os superlucros petrolíferos e criar referendos de iniciativa cidadã. Sem organizador identificado e, segundo a polícia, sem declaração na prefeitura; algumas figuras do movimento original desaconselham ir a Paris. Também se fala de ações em depósitos e refinarias.",de:"Viraler TikTok-Aufruf, die Spritpreise einzufrieren, Übergewinne der Ölkonzerne zu besteuern und Bürgerentscheide einzuführen. Kein bekannter Organisator und laut Polizei keine Anmeldung bei der Präfektur; einige Figuren der ursprünglichen Bewegung raten davon ab, nach Paris zu kommen. Auch Aktionen an Tanklagern und Raffinerien werden erwähnt."},
  src:[["Planet.fr", "https://www.planet.fr/gilets-jaunes-vers-une-nouvelle-mobilisation-nationale-en-octobre-le-chaos-annonce.2999288.817021.html"], ["Le Bonbon", "https://www.lebonbon.fr/paris/news/rassemblement-gilets-jaunes-prevu-octobre-2026/"], ["Public Sénat", "https://www.publicsenat.fr/actualites/societe/appel-a-manifester-le-17-octobre-y-a-t-il-une-realite-derriere-cette-tendance-des-reseaux-sociaux"], ["Contre Attaque", "https://contre-attaque.net/2026/09/15/blocages-du-17-octobre-le-mouvement-a-deja-commence/"]]},

 {id:"oct1961",date:"2026-10-17",kind:"rally",status:"unconfirmed",pts:[PLACES.stmichel],
  time:{en:"18:00 (usual time)",es:"18:00 (hora habitual)",fr:"18h (horaire habituel)",zh:"18:00（惯常时间）",pt:"18:00 (hora habitual)",de:"18:00 (übliche Zeit)"},
  title:{en:"Remembrance of the 17 October 1961 massacre",es:"Homenaje a las víctimas de la masacre del 17 de octubre de 1961",fr:"Commémoration du massacre du 17 octobre 1961",zh:"纪念1961年10月17日屠杀",pt:"Homenagem às vítimas do massacre de 17 de outubro de 1961",de:"Gedenken an das Massaker vom 17. Oktober 1961"},
  where:{en:"Pont Saint-Michel",es:"Pont Saint-Michel",fr:"Pont Saint-Michel",zh:"Pont Saint-Michel（圣米歇尔桥）",pt:"Pont Saint-Michel",de:"Pont Saint-Michel"},
  desc:{en:"Every year at 18:00 on 17 October, associations, unions and left parties gather on the bridge where Algerian demonstrators were killed and thrown into the Seine by Maurice Papon's police in 1961. They ask for recognition as a state crime and open archives. The 2026 call wasn't found yet, so this is based on the yearly tradition.",
        es:"Cada 17 de octubre a las 18:00, asociaciones, sindicatos y partidos de izquierda se reúnen en el puente donde en 1961 la policía de Maurice Papon mató y arrojó al Sena a manifestantes argelinos. Piden que se reconozca como crimen de Estado y la apertura de los archivos. Aún no se ha encontrado la convocatoria de 2026; se basa en la tradición anual.",
        fr:"Chaque 17 octobre à 18h, associations, syndicats et partis de gauche se rassemblent sur le pont où des manifestants algériens furent tués et jetés dans la Seine par la police de Maurice Papon en 1961. Ils demandent la reconnaissance d'un crime d'État et l'ouverture des archives. L'appel 2026 n'a pas encore été trouvé : l'entrée repose sur le rendez-vous annuel.",zh:"每年10月17日18:00，协会、工会和左翼政党会聚集在这座桥上——1961年，莫里斯·帕蓬领导的警察在此杀害阿尔及利亚示威者并将其抛入塞纳河。他们要求承认这是国家罪行并开放档案。尚未找到2026年的号召，此条目基于每年的惯例。",pt:"Todos os anos, a 17 de outubro às 18:00, associações, sindicatos e partidos de esquerda reúnem-se na ponte onde em 1961 a polícia de Maurice Papon matou manifestantes argelinos e os atirou ao Sena. Pedem o reconhecimento como crime de Estado e a abertura dos arquivos. A convocatória de 2026 ainda não foi encontrada; baseia-se na tradição anual.",de:"Jedes Jahr am 17. Oktober um 18:00 versammeln sich Vereine, Gewerkschaften und linke Parteien auf der Brücke, auf der 1961 die Polizei unter Maurice Papon algerische Demonstrierende tötete und in die Seine warf. Sie fordern die Anerkennung als Staatsverbrechen und offene Archive. Der Aufruf für 2026 wurde noch nicht gefunden; der Eintrag beruht auf der jährlichen Tradition."},
  src:[["Le Courrier de l'Atlas","https://www.lecourrierdelatlas.com/paris-un-rassemblement-en-memoire-des-victimes-algeriennes-du-17-octobre-1961-sur-le-pont-saint-michel/"],["Wikipedia","https://en.wikipedia.org/wiki/1961_Paris_massacre"]]},

        fr:"Grève nationale de cinq jours de l'UNSA PNC, du SNPNC-FO, du SNGAF, du SNPL et de l'UNAC contre la réforme du cumul emploi-retraite. Elle tombe au début des vacances de la Toussaint ; les compagnies n'ont pas encore annoncé d'annulations.",zh:"UNSA PNC、SNPNC-FO、SNGAF、SNPL 和 UNAC 发起为期五天的全国罢工，反对“边工作边领养老金”（cumul emploi-retraite）改革。罢工正值诸圣节学校假期开始；航空公司尚未宣布取消航班。",pt:"Greve nacional de cinco dias da UNSA PNC, SNPNC-FO, SNGAF, SNPL e UNAC contra a reforma da acumulação de emprego e reforma (cumul emploi-retraite). Coincide com o início das férias escolares do Dia de Todos os Santos; as companhias ainda não anunciaram cancelamentos.",de:"Fünftägiger landesweiter Streik von UNSA PNC, SNPNC-FO, SNGAF, SNPL und UNAC gegen die Reform zum Hinzuverdienst neben der Rente (cumul emploi-retraite). Er fällt auf den Beginn der Herbstferien (Toussaint); Airlines haben noch keine Annullierungen angekündigt."},

  time:{fr:"Depuis le jeu. 1er oct.",en:"Since Thu 1 Oct",es:"Desde el jue. 1 oct.",zh:"自10月1日（周四）起",pt:"Desde qui. 1 out.",de:"Seit Do. 1. Okt."},title:{fr:"Blocages d'universités",en:"University blockades",es:"Bloqueos de universidades",zh:"大学封锁行动",pt:"Bloqueios de universidades",de:"Blockaden von Universitäten"},where:{fr:"Campus parisiens, dont Sorbonne Université (Clignancourt, Malesherbes) et Paris 1 (Centre René-Cassin)",en:"Paris campuses, incl. Sorbonne Université (Clignancourt, Malesherbes) and Paris 1 (Centre René-Cassin)",es:"Campus de París, entre ellos Sorbonne Université (Clignancourt, Malesherbes) y Paris 1 (Centre René-Cassin)",zh:"巴黎多个校区，包括索邦大学（Clignancourt、Malesherbes）和巴黎第一大学（Centre René-Cassin）",pt:"Campus de Paris, incl. Sorbonne Université (Clignancourt, Malesherbes) e Paris 1 (Centre René-Cassin)",de:"Pariser Standorte, u. a. Sorbonne Université (Clignancourt, Malesherbes) und Paris 1 (Centre René-Cassin)"},desc:{fr:"Les universités ont rejoint le mouvement lycéen : selon l'Union étudiante, une trentaine de facs étaient (partiellement) bloquées le 1er octobre, dont Nanterre et plusieurs sites parisiens. Paris 1 a aussi été touchée sur son site de La Chapelle. Les marqueurs indiquent les campus cités dans la presse.",en:"Universities have joined the high-school movement: according to the Union étudiante, about 30 universities were (partly) blocked on 1 Oct, including Nanterre and several Paris sites. Paris 1 was also hit at its La Chapelle site. Markers show campuses named in reports.",es:"Las universidades se han sumado al movimiento de los institutos: según la Union étudiante, una treintena de universidades estaban (parcialmente) bloqueadas el 1 de octubre, entre ellas Nanterre y varios campus de París. Paris 1 también se vio afectada en su sede de La Chapelle. Los marcadores señalan los campus citados en la prensa.",zh:"大学已加入高中生运动：据 Union étudiante 称，10月1日约有30所大学被（部分）封锁，包括南泰尔大学和巴黎多个校区。巴黎第一大学的 La Chapelle 校区也受到影响。地图标记为报道中提到的校区。",pt:"As universidades juntaram-se ao movimento dos liceus: segundo a Union étudiante, cerca de 30 universidades estavam (parcialmente) bloqueadas a 1 out., incluindo Nanterre e vários campus de Paris. A Paris 1 também foi afetada no seu polo de La Chapelle. Os marcadores mostram os campus citados na imprensa.",de:"Die Universitäten haben sich der Schülerbewegung angeschlossen: Laut Union étudiante waren am 1. Okt. rund 30 Hochschulen (teilweise) blockiert, darunter Nanterre und mehrere Pariser Standorte. Auch Paris 1 war an ihrem Standort La Chapelle betroffen. Die Markierungen zeigen in Berichten genannte Campus."},
  src:[["L'Etudiant","https://www.letudiant.fr/lifestyle/engagement-et-vie-associative/article/blocus-des-lycees-les-universites-rejoignent-le-mouvement-plus-d-un-tiers-des-facs-bloquees-selon-l-union-etudiante.html"],["Union étudiante","https://union-etudiante.fr/communique-de-presse/30-universites-bloquees-une-mobilisation-historique-en-france/"],["France 24","https://www.france24.com/fr/info-en-continu/20261001-des-campus-universitaires-rejoignent-les-lyc%C3%A9es-dans-la-contestation-sociale"]]},

/* ---------- dates ---------- */
const pad=n=>String(n).padStart(2,"0");

const addDays=(iso,d)=>{const t=new Date(iso+"T12:00:00");t.setDate(t.getDate()+d);return `${t.getFullYear()}-${pad(t.getMonth()+1)}-${pad(t.getDate())}`;};
const WEEK=addDays(TODAY,7);

}

/* ---------- projection ---------- */
const W=1000,H=610,LON0=2.2259,LAT1=48.9013,KX=Math.cos(48.859*Math.PI/180);
const S=Math.min((W-40)/((2.4698-LON0)*KX),(H-40)/(LAT1-48.8161));
const OX=(W-(2.4698-LON0)*KX*S)/2, OY=(H-(LAT1-48.8161)*S)/2;
const P=([lon,lat])=>[OX+(lon-LON0)*KX*S, OY+(LAT1-lat)*S];
const line=pts=>"M"+pts.map(p=>P(p).map(v=>v.toFixed(1)).join(",")).join("L");

const svg=d3.select("#map"), svgEl=document.getElementById("map"), g=svg.append("g");
const gBase=g.append("g"), gRoads=g.append("g"), gWater=g.append("g"), gBridges=g.append("g"), gRoutes=g.append("g"), gLabels=g.append("g"), gMarks=g.append("g");
ARR.forEach(a=>a.r.forEach(r=>gBase.append("path").attr("class","arr").attr("d",line(r)+"Z")));
const seineSplit=SEINE.indexOf(null);
const smooth=d3.line().x(p=>P(p)[0]).y(p=>P(p)[1]).curve(d3.curveCatmullRom.alpha(0.5));
const SEINE_E=SEINE.slice(0,seineSplit), SEINE_W=SEINE.slice(seineSplit+1);
const seine=gWater.append("path").attr("class","seine").attr("d",smooth(SEINE_E)+smooth(SEINE_W));
/* The two arms of the Seine around Île de la Cité and Île Saint-Louis, then the islands drawn as land on top. */
const SEINE_N=[[2.3375,48.8583],[2.3412,48.8584],[2.3440,48.8582],[2.3468,48.8575],[2.3490,48.8567],[2.3512,48.8557],[2.3532,48.8546],[2.3556,48.8543],[2.3580,48.8538],[2.3603,48.8527],[2.3618,48.8512],[2.3640,48.8492],[2.3660,48.8463]];
const SEINE_S=[[2.3375,48.8583],[2.3400,48.8566],[2.3420,48.8553],[2.3445,48.8538],[2.3462,48.8529],[2.3485,48.8517],[2.3510,48.8508],[2.3540,48.8512],[2.3560,48.8508],[2.3580,48.8502],[2.3600,48.8496],[2.3622,48.8490],[2.3640,48.8480],[2.3660,48.8463]];
const ISLANDS=[
  [[2.3390,48.8574],[2.3412,48.8580],[2.3440,48.8575],[2.3468,48.8569],[2.3490,48.8560],[2.3512,48.8549],[2.3527,48.8535],[2.3534,48.8522],[2.3522,48.8516],[2.3505,48.8514],[2.3485,48.8522],[2.3466,48.8530],[2.3446,48.8541],[2.3425,48.8556],[2.3405,48.8566]],
  [[2.3537,48.8530],[2.3556,48.8538],[2.3580,48.8531],[2.3600,48.8521],[2.3613,48.8507],[2.3598,48.8503],[2.3575,48.8509],[2.3553,48.8517],[2.3540,48.8524]]];
const seineArms=[SEINE_N,SEINE_S].map(a=>gWater.append("path").attr("class","seine").attr("d",smooth(a)));
ISLANDS.forEach(r=>gWater.append("path").attr("class","arr isle").attr("d",line(r)+"Z"));
const flat=a=>{const o=[];for(let i=0;i<a.length;i+=2)o.push([a[i],a[i+1]]);return o;};
/* Roads come from straight IGN segments and don't follow the hand-drawn river exactly, so the water is drawn
   over them and only real crossings (bridges) and island streets are drawn again on top of the water. */
const RIVERS=[SEINE_E,SEINE_W,SEINE_N,SEINE_S].map(a=>a.map(P));
function cross(a,b,c,d){const o=(p,q,r)=>(q[0]-p[0])*(r[1]-p[1])-(q[1]-p[1])*(r[0]-p[0]);
  return o(a,b,c)*o(a,b,d)<0 && o(c,d,a)*o(c,d,b)<0;}
function angle(a,b,c,d){const u=[b[0]-a[0],b[1]-a[1]],v=[d[0]-c[0],d[1]-c[1]];
  const cs=Math.abs(u[0]*v[0]+u[1]*v[1])/(Math.hypot(...u)*Math.hypot(...v)||1);return Math.acos(Math.min(1,cs))*180/Math.PI;}
/* Returns the bridge decks for a road segment: for each real crossing, the piece of the road that spans the
   water from bank to bank (so a bridge never stops mid-river, whatever the road data's node positions). */
function bridgeDecks(a,b){
  const L=Math.hypot(b[0]-a[0],b[1]-a[1]); if(L>40) return [];     /* longer than ~700 m: a quay edge, not a bridge */
  const ux=(b[0]-a[0])/L, uy=(b[1]-a[1])/L, out=[];
  RIVERS.forEach((r,k)=>{const half=k<2?4.6:2.8;
    for(let i=0;i<r.length-1;i++){const c=r[i],d=r[i+1]; if(!cross(a,b,c,d)) continue;
      const th=angle(a,b,c,d); if(th<35) continue;
      const den=(b[0]-a[0])*(d[1]-c[1])-(b[1]-a[1])*(d[0]-c[0]); const t=((c[0]-a[0])*(d[1]-c[1])-(c[1]-a[1])*(d[0]-c[0]))/den;
      const ix=a[0]+t*(b[0]-a[0]), iy=a[1]+t*(b[1]-a[1]), h=(half+1.6)/Math.sin(th*Math.PI/180);
      out.push([[ix-ux*h,iy-uy*h],[ix+ux*h,iy+uy*h]]);}});
  return out;}
const ISLE_P=ISLANDS.map(r=>r.map(P));
function inIsle(pt){return ISLE_P.some(poly=>{let c=false;for(let i=0,j=poly.length-1;i<poly.length;j=i++){const[xi,yi]=poly[i],[xj,yj]=poly[j];
  if((yi>pt[1])!==(yj>pt[1]) && pt[0]<(xj-xi)*(pt[1]-yi)/(yj-yi)+xi) c=!c;}return c;});}
const roadD=[], bridgeD=[];
ROADS.forEach((list,ci)=>{let all="",br="";list.forEach(a=>{const pts=flat(a).map(P);
  for(let i=0;i<pts.length-1;i++){const seg=`M${pts[i][0].toFixed(1)},${pts[i][1].toFixed(1)}L${pts[i+1][0].toFixed(1)},${pts[i+1][1].toFixed(1)}`;
    all+=seg;
    if(inIsle(pts[i])&&inIsle(pts[i+1])) br+=seg;
    else bridgeDecks(pts[i],pts[i+1]).forEach(([p,q])=>{br+=`M${p[0].toFixed(1)},${p[1].toFixed(1)}L${q[0].toFixed(1)},${q[1].toFixed(1)}`;});}});
  roadD[ci]=all; bridgeD[ci]=br;});
function roadLayer(gg,D){return {cs:[0,1,2].map(i=>gg.append("path").attr("class","road case").attr("d",D[i])),
  fl:[2,1,0].map(i=>gg.append("path").attr("class","road r"+i).attr("d",D[i]))};}
const roadLayers=[roadLayer(gRoads,roadD),roadLayer(gBridges,bridgeD)];
function centroid(r){let A=0,cx=0,cy=0;const pts=r.map(P);for(let i=0;i<pts.length-1;i++){const[x0,y0]=pts[i],[x1,y1]=pts[i+1],f=x0*y1-x1*y0;A+=f;cx+=(x0+x1)*f;cy+=(y0+y1)*f;}A/=2;return[cx/(6*A),cy/(6*A)];}
const numNodes=ARR.map(a=>{const big=a.r.reduce((m,r)=>r.length>m.length?r:m,a.r[0]);const[x,y]=centroid(big);return gLabels.append("text").attr("class","arrnum").attr("data-x",x).attr("data-y",y).text(a.n+(a.n===1?"er":"e"));});
const lmNodes=LANDMARKS.concat(LANDMARKS2.map(l=>[...l,1])).map(([name,pt,side,minor])=>{const[x,y]=P(pt);const gg=gLabels.append("g").attr("class",minor?"lm2":null).attr("data-x",x).attr("data-y",y);gg.append("circle").attr("class","lmdot").attr("r",1.6);gg.append("text").attr("class","lm").attr("x",side==="r"?5:-5).attr("y",-5).attr("text-anchor",side==="r"?"start":"end").text(name);return gg;});

const color=k=>`var(--k-${k})`;
function shape(sel,kind,r){
  if(kind==="strike") return sel.append("rect").attr("class","shape").attr("x",-r).attr("y",-r).attr("width",2*r).attr("height",2*r).attr("rx",1.5);
  if(kind==="disruption") return sel.append("path").attr("class","shape").attr("d",`M0,${-r*1.25}L${r*1.15},${r*0.85}L${-r*1.15},${r*0.85}Z`);
  if(kind==="blockade") return sel.append("path").attr("class","shape").attr("d",`M0,${-r*1.3}L${r*1.3},0L0,${r*1.3}L${-r*1.3},0Z`);
  return sel.append("circle").attr("class","shape").attr("r",r);
}

let K=1, markerNodes=[];
let PPU=1; /* screen px per map unit at zoom 1 */
let endcaps=[];
function placeAll(){
  const s=1/K, narrow=isNarrow();
  const ms=narrow? s*Math.max(1, 1.3/PPU) : s;    /* event icons ~10px radius on phones */
  const ls=narrow? s*Math.max(1, 0.82/PPU) : s;   /* place labels ~9px on phones */
  numNodes.forEach(n=>n.attr("transform",`translate(${n.attr("data-x")},${n.attr("data-y")}) scale(${ls})`));
  lmNodes.forEach(n=>n.attr("transform",`translate(${n.attr("data-x")},${n.attr("data-y")}) scale(${ls})`));
  markerNodes.forEach(m=>m.node.attr("transform",`translate(${m.x},${m.y}) scale(${ms}) translate(${m.dx},${m.dy})`));
  const ec=9*ms; endcaps.forEach(r=>r.attr("x",+r.attr("data-x")-ec/2).attr("y",+r.attr("data-y")-ec/2).attr("width",ec).attr("height",ec));
  seine.attr("stroke-width",Math.max(8,4/(K*PPU)));
  seineArms.forEach(a=>a.attr("stroke-width",Math.max(4.6,2.5/(K*PPU))));
  const q=Math.sqrt(K);
  roadLayers.forEach(L=>[[2,1.1],[1,1.8],[0,2.6]].forEach(([i,w],j)=>{L.fl[j].attr("stroke-width",w*q);L.cs[i].attr("stroke-width",w*q+1.4);}));
  svgEl.classList.toggle("z-lm",K>=1.8);
}

function drawMap(list){
  endcaps=[];
  gRoutes.selectAll("*").remove(); gMarks.selectAll("*").remove(); markerNodes=[];
  const mapped=list.filter(e=>e.pts);
  mapped.filter(e=>e.route).forEach(e=>{
    const ph=phase(e);
    gRoutes.append("path").attr("class","route"+(ph==="past"?" past":"")+(state.sel===e.id?" sel":"")).attr("d",line(e.route)).attr("stroke",color(e.kind));
    const [ex,ey]=P(e.route[e.route.length-1]);
    endcaps.push(gRoutes.append("rect").attr("class","endcap").attr("data-x",ex).attr("data-y",ey).attr("fill",color(e.kind)).attr("opacity",ph==="past"?.4:1).attr("vector-effect","non-scaling-stroke"));
  });
  const groups=new Map();
  mapped.forEach(e=>e.pts.forEach((pt,i)=>{const key=pt[0].toFixed(3)+","+pt[1].toFixed(3);if(!groups.has(key))groups.set(key,[]);groups.get(key).push({e,pt,i});}));
  groups.forEach(arr=>{
    const n=arr.length;
    arr.sort((a,b)=>(a.e.id===state.sel)-(b.e.id===state.sel));
    arr.forEach((o,j)=>{
      const [x,y]=P(o.pt); const ang=-Math.PI/2+j*2*Math.PI/n; const R=n>1?11+n:0;
      const dx=Math.cos(ang)*R, dy=Math.sin(ang)*R;
      const ph=phase(o.e);
      const node=gMarks.append("g").attr("class",`mk ${o.e.status} ${ph==="past"?"past":""} ${ph==="live"?"live":""} ${state.sel===o.e.id?"sel":""}`)
        .attr("tabindex",0).attr("role","button").attr("aria-label",`${L(o.e.title)}, ${fmtDay(o.e.date)}`);
      node.append("title").text(`${L(o.e.title)}\n${fmtDay(o.e.date)} · ${o.e.ptNames?o.e.ptNames[o.i]:L(o.e.where)}`);
      node.append("circle").attr("class","hit").attr("r",13);
      node.append("circle").attr("class","pulse").attr("r",9).attr("stroke",color(o.e.kind));
      shape(node,o.e.kind,o.e.kind==="blockade"?5.5:7).attr("fill",color(o.e.kind));
      node.on("click",ev=>{ev.stopPropagation();select(o.e.id,true);});
      node.on("keydown",ev=>{if(ev.key==="Enter"||ev.key===" "){ev.preventDefault();select(o.e.id,true);}});
      markerNodes.push({node,x,y,dx,dy});
    });
  });
  placeAll();
}

const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function drawList(list){
  const box=document.getElementById("items"); box.innerHTML="";
  document.getElementById("count").textContent=T("shown")(list.length);
  if(!list.length){box.innerHTML=`<div class="empty">${esc(T("empty"))}</div>`;return;}
  const byDay=new Map(); list.forEach(e=>{if(!byDay.has(e.date))byDay.set(e.date,[]);byDay.get(e.date).push(e);});
  byDay.forEach((evs,day)=>{
    const grp=document.createElement("section"); grp.className="daygroup";
    grp.innerHTML=`<div class="dayhead">${esc(fmtDay(day))}${day===TODAY?`<span class="now">${esc(T("today"))}</span>`:""}</div>`;
    evs.forEach(e=>{
      const ph=phase(e), sel=state.sel===e.id;
      const it=document.createElement("div"); it.className=`item ${ph==="past"?"past":""} ${sel?"sel":""}`; it.tabIndex=0; it.id="ev-"+e.id; it.setAttribute("role","button"); it.setAttribute("aria-expanded",sel);
      const range=e.end&&!e.openEnd?` → ${fmtDay(e.end)}`:"";
      const pills=[`<span class="pill ${e.status}">${esc(T(e.status))}</span>`];
      if(ph==="live") pills.push(`<span class="pill confirmed">${esc(T("ongoing"))}</span>`);
      if(e.citywide) pills.push(`<span class="pill offmap">${esc(T("citywide"))}</span>`);
      else if(e.offmap) pills.push(`<span class="pill offmap">${esc(T("notOnMap"))}</span>`);
      it.innerHTML=`<div class="bar" style="background:${color(e.kind)}"></div><div style="min-width:0">
        <h3>${esc(L(e.title))}</h3>
        <div class="meta"><span class="t">${esc(L(e.time))}${esc(range)}</span><span>${esc(L(e.where))}</span></div>
        <div class="meta">${pills.join("")}<span>${esc(T(e.kind))}</span></div>
        ${sel?`<div class="detail"><p>${esc(L(e.desc))}</p>${e.impact?`<p class="impact"><b>${esc(T("impact"))}</b> ${esc(L(e.impact))}</p>`:""}${e.routeTxt?`<p class="route-txt"><b>${esc(T("route"))}</b> ${esc(L(e.routeTxt))}</p>`:""}<div class="src">${esc(T("sources"))} ${e.src.map(([t,u])=>`<a href="${esc(u)}" target="_blank" rel="noopener">${esc(t)}</a>`).join("")}</div></div>`:""}
      </div>`;
      it.onclick=ev=>{if(ev.target.closest("a"))return; select(sel?null:e.id,false);};
      it.onkeydown=ev=>{if(ev.key==="Enter"||ev.key===" "){ev.preventDefault();select(sel?null:e.id,false);}};
      grp.appendChild(it);
    });
    box.appendChild(grp);
  });
}

function render(){
  WHEN.forEach(k=>document.getElementById("when-"+k).setAttribute("aria-pressed",state.when===k));
  document.getElementById("whensel").value=state.when;
  document.querySelectorAll("#typelist input").forEach(i=>i.checked=state.kinds.has(i.value));
  const n=state.kinds.size;
  document.getElementById("typesum").textContent= n===KIND_KEYS.length? T("all") : n<=2? [...state.kinds].map(k=>T(k)).join(", ") : `${n}/${KIND_KEYS.length}`;
  KIND_KEYS.forEach(k=>document.getElementById("kind-"+k).setAttribute("aria-pressed",state.kinds.has(k)));
  const list=EVENTS.filter(visible).sort((a,b)=>a.date.localeCompare(b.date));
  if(state.when==="past") list.reverse();
  drawMap(list); drawList(list);
}

function select(id,fromMap){
  state.sel=id; render();
  if(id&&fromMap){const el=document.getElementById("ev-"+id); if(el) el.scrollIntoView({block:"nearest",behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"});}
  if(id&&!fromMap){const e=EVENTS.find(x=>x.id===id); if(e&&e.pts) focusOn(e);}
}

/* ---------- zoom ---------- */
const zoom=d3.zoom().scaleExtent([1,14]).on("zoom",ev=>{g.attr("transform",ev.transform);K=ev.transform.k;placeAll();});
let padY=0;
function fitViewBox(){
  const r=svgEl.getBoundingClientRect(); if(!r.width) return;
  const vbH=Math.max(H,W*r.height/r.width); padY=(vbH-H)/2; PPU=r.width/W;
  svg.attr("viewBox",`0 ${-padY} ${W} ${vbH}`);
  zoom.extent([[0,-padY],[W,H+padY]]).translateExtent([[-60,-padY-60],[W+60,H+padY+60]]);
}
fitViewBox();
svg.call(zoom);
svg.on("click",()=>{if(state.sel){state.sel=null;render();}});
function isNarrow(){ return matchMedia("(max-width: 700px)").matches; }
function homeView(){ return isNarrow()? d3.zoomIdentity.translate(W/2,H/2).scale(Math.max(2.1,(H+2*padY)/H*1.02)).translate(-P(PLACES.chatelet)[0],-P(PLACES.chatelet)[1]) : d3.zoomIdentity; }
svg.call(zoom.transform,homeView());
let rz; window.addEventListener("resize",()=>{clearTimeout(rz);rz=setTimeout(()=>{fitViewBox();svg.call(zoom.transform,d3.zoomTransform(svgEl));},150);});
document.getElementById("zin").onclick=()=>svg.transition().duration(250).call(zoom.scaleBy,1.6);
document.getElementById("zout").onclick=()=>svg.transition().duration(250).call(zoom.scaleBy,1/1.6);
document.getElementById("zreset").onclick=()=>svg.transition().duration(300).call(zoom.transform,homeView());
const hint=document.getElementById("hint"); const hideHint=()=>hint.classList.add("gone");
svgEl.addEventListener("pointerdown",hideHint,{once:true}); svgEl.addEventListener("wheel",hideHint,{once:true,passive:true}); setTimeout(hideHint,8000);
function focusOn(e){
  const pts=(e.route||e.pts).map(P); const xs=pts.map(p=>p[0]), ys=pts.map(p=>p[1]);
  const x0=Math.min(...xs),x1=Math.max(...xs),y0=Math.min(...ys),y1=Math.max(...ys);
  const k=Math.max(K,Math.min(isNarrow()?5:4,0.6/Math.max((x1-x0)/W,(y1-y0)/H,0.15)));
  const t=d3.zoomIdentity.translate(W/2,H/2).scale(k).translate(-(x0+x1)/2,-(y0+y1)/2);
  svg.transition().duration(matchMedia("(prefers-reduced-motion: reduce)").matches?0:450).call(zoom.transform,t);
}

applyLang();
render();
</script>
